# Background queue, stored in the database (table messenger_messages).
# app:schedule:run starts a worker every minute; locally DDEV runs one (.ddev/config.yaml).
framework:
    messenger:
        # Messages that failed all retries: see them with messenger:failed:show, retry with messenger:failed:retry
        failure_transport: failed

        transports:
            # Charges, payment and subscription checks with Mollie: one client every 2 seconds
            billing:
                dsn: 'doctrine://default?queue_name=billing'
                rate_limiter: billing_queue
                retry_strategy: { max_retries: 3, delay: 60000, multiplier: 5 } # after 1, 5 and 25 minutes
            # Work a visitor shouldn't wait for, like sending emails
            async:
                dsn: 'doctrine://default?queue_name=async'
                retry_strategy: { max_retries: 3, delay: 60000, multiplier: 5 }
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Billing\ChargeClient: billing
            App\Billing\SyncPayment: billing
            App\Billing\SyncSubscription: billing
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
