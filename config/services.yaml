parameters:
    # Defaults, so an existing .env without the billing variables keeps working
    env(MOLLIE_API_KEY): ''
    env(BILLING_MONTHLY_PRICE): '5900'
    env(BILLING_VAT_RATE): '21'
    env(BILLING_CURRENCY): 'EUR'
    env(BILLING_BRAND): 'CasitaFix'
    env(BILLING_WEBHOOKS): '0'
    env(FACTURADIRECTA_API_KEY): ''
    env(FACTURADIRECTA_COMPANY_ID): ''
    env(FACTURADIRECTA_SERIES): 'F-##-'
    env(FACTURADIRECTA_TAX): 'S_IVA_21'
    env(FACTURADIRECTA_ACCOUNT): '700000'
    env(CLOUDFLARE_ACCOUNT_ID): ''
    env(CLOUDFLARE_API_TOKEN): ''
    env(TURNSTILE_HOSTNAMES_PER_WIDGET): '10'
    env(TURNSTILE_WIDGET_MODE): 'managed'
    env(TURNSTILE_SITE_KEY): ''
    env(TURNSTILE_SECRET_KEY): ''

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
