    faq_eyebrow: FAQ
    faq_title: Les questions qu’on nous pose souvent
    faq1_q: Que veut dire concrètement « trouvable par les assistants IA » ?
    faq1_a: 'De plus en plus de gens demandent à ChatGPT, Gemini, Claude ou Perplexity des choses comme « trouve-moi un plombier francophone près de Jávea ». Ces assistants lisent les sites web pour répondre. Votre site leur donne des informations claires et structurées — ce que vous faites, où vous travaillez, comment vous joindre — pour qu’ils puissent vous recommander en toute confiance au lieu de deviner.'
    faq2_q: Y a-t-il des frais de mise en service ou un long engagement ?
    faq2_a: Ni frais de mise en service, ni engagement. Un seul prix couvre le site, l’hébergement, la configuration Google et le référencement continu. Payez au mois et résiliez quand vous voulez, ou payez un an d’avance et profitez de deux mois offerts. Nous vous écrivons deux semaines avant chaque paiement annuel.
    faq3_q: Dois-je m’y connaître en sites web ?
    faq3_a: Non. Nous créons le site, connectons votre domaine et configurons Google pour vous. Ensuite, vous pouvez mettre à jour vos services et ajouter des photos de vos chantiers récents depuis une interface simple — ou simplement nous les envoyer.
    faq4_q: Puis-je utiliser mon propre nom de domaine ?
    faq4_a: Oui. Apportez le domaine que vous avez déjà, ou nous vous aidons à en enregistrer un. Le HTTPS est inclus et fonctionne dès la première visite.
    faq5_q: Quelles langues sont disponibles ?
    faq5_a: Anglais, espagnol, néerlandais, allemand et français. Choisissez les langues de vos clients ; chacune a ses propres pages, pour que Google et les assistants IA montrent la bonne version à la bonne personne.
    faq6_q: Est-ce légal pour une entreprise en Espagne ?
    faq6_a: Chaque site comprend des mentions légales et une page de confidentialité (LSSI et RGPD) générées à partir des informations de votre entreprise, et aucun bandeau cookies n’est nécessaire. Nous vous conseillons tout de même de faire vérifier les textes par votre gestor.
    final_title: Prêts quand vous l’êtes.
    final_text: L’inscription prend environ cinq minutes. Nous vérifions vos informations et votre site est généralement en ligne sous deux jours ouvrés. %price% € par mois, ou deux mois offerts avec la formule annuelle.

