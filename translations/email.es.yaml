    eyebrow: 'Tu web está lista'
    heading: '¡Buenas noticias, %name%!'
    intro: 'Hemos creado tu web para %name%. En tu panel puedes actualizar tus servicios, añadir fotos de trabajos terminados y leer las consultas. Guarda este correo a mano.'
    password_chosen: 'La que elegiste al registrarte'
    setup_password: 'Primero elige tu contraseña. El enlace funciona durante 7 días.'
    setup_cta: 'Elegir contraseña'
    cta: 'Abrir tu panel'
    next_title: 'Tres cosas que te ayudan a que te encuentren'
    step1_title: 'Añade fotos de tu trabajo'
    step1_text: 'Las fotos de antes y después funcionan mejor. Unas pocas buenas valen más que muchas borrosas.'
    step2_title: 'Revisa tus servicios y tu zona de trabajo'
    step2_text: 'De ellos depende en qué búsquedas apareces.'
    step3_title: 'Comparte tu enlace'
    step3_text: 'Pon tu web en tu página de Facebook, tu perfil de WhatsApp y tu furgoneta.'
    domain_title: 'Usar tu propio dominio %domain%'
    domain_intro: 'Entra donde compraste tu dominio (tu registrador) y configura estos registros DNS. Borra cualquier otro registro A y AAAA para "@" y "www".'
