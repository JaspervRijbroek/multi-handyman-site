    domain_after: 'En cuanto funcione (normalmente en unas horas), tu web pasa sola a https://%domain%, con HTTPS. Tu dirección actual sigue funcionando y redirige a los visitantes. Puedes seguir el progreso en tu panel, en "Tu dominio".'
    google: 'También conectamos tu web con Google Search Console. Ocurre automáticamente en cuanto tu web está online.'

invitation:
    subject: '%inviter% te invita a %brand%'
    preheader: 'Una web profesional para tu negocio, y tu segundo mes es gratis.'
    eyebrow: 'Una invitación'
    heading: 'Hola, %name%:'
    intro: '%inviter% usa %brand% para su web y te invita a probarlo también.'
    what: '%brand% le da a tu negocio una web profesional en varios idiomas, con formulario de contacto, opiniones y WhatsApp, que puedes editar tú mismo fácilmente.'
    offer_title: 'Tu segundo mes es gratis'
    offer_text: 'Regístrate con tu enlace personal de abajo. El enlace funciona una sola vez.'
    cta: 'Registrarme'
    questions: '¿Dudas? Responde a este correo para preguntar a %inviter%.'
    reason: 'Recibes este correo porque %inviter% te ha invitado. No te volveremos a escribir salvo que te registres.'

enquiry:
    subject: 'Nueva consulta de %name% en %host%'
    eyebrow: 'Nueva consulta · %host%'
    heading: '%name% necesita una mano'
    intro: 'Alguien acaba de usar el formulario de contacto de tu web. Esto es lo que ha escrito:'
    details_title: 'Datos de contacto'
    reply: 'Responder a %name%'
    call: 'Llamar a %name%'
    tip: 'Consejo: los clientes suelen quedarse con quien responde primero. Una respuesta rápida hoy, aunque sea "paso a echar un vistazo", marca la diferencia.'
    admin: 'También encontrarás esta consulta en tu panel.'
    admin_link: 'Abrir tu panel'
    reason: 'Recibes este correo porque alguien ha usado el formulario de contacto de %host%.'

review:
    subject: 'Nueva opinión de %name%'
    anonymous: 'Un cliente'
    stars: '%rating% de 5 estrellas'
    eyebrow: 'Nueva opinión · %host%'
    heading: '%name% te ha dado %rating% de 5 estrellas'
    intro: 'Un cliente ha dejado una opinión en tu web:'
