legal:
    title: Impressum & Datenschutz
    owner:
        title: Wer diese Website betreibt
        text: 'Gemäß spanischem Recht (Ley 34/2002, LSSI) ist der Inhaber von %site%:'
        name: Inhaber
        tax_id: Steuernummer (NIF/NIE/CIF)
        address: Adresse
        phone: Telefon
        email: E-Mail
    privacy:
        title: Datenschutzerklärung
        controller: '%owner% ist verantwortlich für die personenbezogenen Daten, die Sie über diese Website senden.'
        purpose: Wir verwenden die Daten aus dem Kontaktformular nur, um Ihre Anfrage zu beantworten und, wenn Sie möchten, ein Angebot zu erstellen. Rechtsgrundlage sind Ihre Einwilligung und vorvertragliche Maßnahmen auf Ihre Anfrage. Wir verkaufen Ihre Daten nicht und geben sie nicht weiter, außer an Dienstleister, die diese Website und ihre E-Mails in unserem Auftrag hosten. Zum Schutz vor Spam ist das Kontaktformular durch Cloudflare Turnstile gesichert, das Ihren Browser ohne Tracking-Cookies prüft.
        retention: Wir speichern Ihre Anfrage so lange, wie es für die Bearbeitung und gesetzliche Pflichten nötig ist.
        reviews: Wenn Sie eine Bewertung schreiben, veröffentlichen wir nach Prüfung Ihren Vornamen, Wohnort (falls angegeben), Ihre Sterne und Ihren Text auf dieser Website. Sie können uns jederzeit bitten, sie zu entfernen. Wenn wir für Sie gearbeitet haben und Sie uns Ihre E-Mail-Adresse oder Telefonnummer gegeben haben, senden wir Ihnen damit einen Link, um diesen Auftrag zu bewerten; wir löschen sie, sobald Sie Ihre Bewertung abgegeben haben.
        rights: 'Sie können Auskunft, Berichtigung oder Löschung Ihrer Daten verlangen oder der Verwendung widersprechen, per E-Mail an %email%. Sie können sich außerdem bei der spanischen Datenschutzbehörde beschweren (www.aepd.es).'
    cookies:
        title: Cookies
        text: Diese Website verwendet keine Tracking- oder Werbe-Cookies. Ein technisches Sitzungs-Cookie wird nur gesetzt, wenn Sie das Kontaktformular nutzen, um es vor Missbrauch zu schützen. Besucherstatistiken werden, falls aktiviert, anonym und ohne Cookies erfasst.
        map: Die Karte im Kontaktbereich wird erst von OpenStreetMap (OpenStreetMap Foundation, Vereinigtes Königreich) geladen, wenn Sie auf „Karte anzeigen“ klicken; dabei wird Ihre IP-Adresse an deren Server übermittelt. OpenStreetMap setzt keine Werbe- oder Tracking-Cookies.

