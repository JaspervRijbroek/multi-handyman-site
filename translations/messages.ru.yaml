legal:
    title: Правовая информация и конфиденциальность
    owner:
        title: Кто управляет этим сайтом
        text: 'В соответствии с законодательством Испании (Ley 34/2002, LSSI) владельцем сайта %site% является:'
        name: Владелец
        tax_id: Налоговый номер (NIF/NIE/CIF)
        address: Адрес
        phone: Телефон
        email: Email
    privacy:
        title: Политика конфиденциальности
        controller: '%owner% отвечает за персональные данные, которые вы отправляете через этот сайт.'
        purpose: Данные из контактной формы мы используем только для ответа на ваш запрос и, по вашему желанию, для подготовки расчёта. Правовое основание — ваше согласие и действия по вашему запросу до заключения договора. Мы не продаём и не передаём ваши данные, кроме поставщиков, которые по нашему поручению обеспечивают работу этого сайта и его почты. Для защиты от спама контактная форма использует Cloudflare Turnstile, который проверяет ваш браузер без отслеживающих cookie.
        retention: Мы храним ваш запрос столько, сколько нужно для его обработки и выполнения требований закона.
        reviews: Если вы пишете отзыв, после проверки мы публикуем на этом сайте ваше имя, город (если указан), оценку и отзыв. Вы можете в любой момент попросить нас удалить его. Если мы выполняли для вас работу и вы дали нам свой email или номер телефона, мы используем их, чтобы отправить вам ссылку для отзыва об этой работе; после того как вы оставите отзыв, мы их удаляем.
        rights: 'Вы можете запросить доступ к своим данным, их исправление или удаление, а также возразить против их использования, написав на %email%. Вы также можете подать жалобу в Испанское агентство по защите данных (www.aepd.es).'
    cookies:
        title: Cookie
        text: Этот сайт не использует отслеживающие или рекламные cookie. Технический cookie сессии устанавливается только при использовании контактной формы, чтобы защитить её от злоупотреблений. Статистика посещений, если она включена, собирается анонимно и без cookie.
        map: Карта в разделе контактов загружается с OpenStreetMap (OpenStreetMap Foundation, Великобритания) только после нажатия «Показать карту»; при этом ваш IP-адрес передаётся на их серверы для загрузки карты. OpenStreetMap не устанавливает рекламные или отслеживающие cookie.

