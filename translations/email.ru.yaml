layout:
    website_by: 'Сайт создан на'

date: '%day% %month% %year% г.'
month_year: '%month% %year%'
# Inside a date the month is in the genitive ("1 декабря"), on its own it is not ("декабрь 2026")
month:
    1: января
    2: февраля
    3: марта
    4: апреля
    5: мая
    6: июня
    7: июля
    8: августа
    9: сентября
    10: октября
    11: ноября
    12: декабря
month_name:
    1: январь
    2: февраль
    3: март
    4: апрель
    5: май
    6: июнь
    7: июль
    8: август
    9: сентябрь
    10: октябрь
    11: ноябрь
    12: декабрь

language:
    en: английский
    es: испанский
    nl: нидерландский
    de: немецкий
    fr: французский
    ru: русский

field:
    website: 'Ваш сайт'
    admin: 'Ваша панель'
    login: 'Логин'
    password: 'Пароль'
    name: 'Имя'
    email: 'Email'
    phone: 'Телефон'
    language: 'Язык'

common:
    reason_account: 'Вы получили это письмо, потому что у вас есть аккаунт %brand%. Оно касается вашего аккаунта, поэтому в нём нет ссылки для отписки.'
    questions: 'Есть вопросы? Просто ответьте на это письмо.'
    fallback: 'Кнопка не работает? Скопируйте эту ссылку в браузер:'

welcome:
    subject: 'Ваш сайт для %name% готов'
    preheader: 'Ваш сайт уже онлайн. Здесь ваши ссылки и что делать дальше.'
    eyebrow: 'Ваш сайт готов'
    heading: 'Хорошие новости, %name%!'
    intro: 'Ваш сайт для %name% создан. В панели вы можете обновлять услуги, добавлять фото выполненных работ и читать заявки. Сохраните это письмо.'
    password_chosen: 'Тот, что вы выбрали при регистрации'
    setup_password: 'Сначала выберите пароль. Ссылка действует 7 дней.'
    setup_cta: 'Выбрать пароль'
    cta: 'Открыть панель'
    next_title: 'Три шага, чтобы вас находили чаще'
    step1_title: 'Добавьте фото своих работ'
    step1_text: 'Лучше всего работают фото «до и после». Несколько хороших снимков лучше, чем много размытых.'
    step2_title: 'Проверьте услуги и район работы'
    step2_text: 'От них зависит, в каких поисках вы появляетесь.'
    step3_title: 'Поделитесь ссылкой'
    step3_text: 'Разместите адрес сайта на странице в Facebook, в профиле WhatsApp и на своём фургоне.'
    domain_title: 'Свой домен %domain%'
    domain_intro: 'Войдите туда, где вы купили домен (у регистратора), и добавьте эти DNS-записи. Удалите другие записи A и AAAA для «@» и «www».'
    domain_same_as: 'Направьте «@» и «www» на тот же адрес, что и %host%.'
    domain_after: 'Как только это заработает (обычно в течение нескольких часов), сайт сам переедет на https://%domain% с HTTPS. Текущий адрес продолжит работать и будет перенаправлять посетителей. Следить за ходом можно в панели, в разделе «Ваш домен».'
    google: 'Мы также подключаем ваш сайт к Google Search Console. Это происходит автоматически, как только сайт появится онлайн.'

invitation:
    subject: '%inviter% приглашает вас в %brand%'
    preheader: 'Профессиональный сайт для вашего бизнеса, а второй месяц бесплатно.'
    eyebrow: 'Приглашение'
    heading: 'Здравствуйте, %name%!'
    intro: '%inviter% пользуется %brand% для своего сайта и приглашает вас тоже попробовать.'
    what: '%brand% даёт вашему бизнесу профессиональный сайт на нескольких языках, с формой обратной связи, отзывами и WhatsApp, который вы легко редактируете сами.'
    offer_title: 'Второй месяц бесплатно'
    offer_text: 'Зарегистрируйтесь по своей личной ссылке ниже. Ссылка работает один раз.'
    cta: 'Зарегистрироваться'
    questions: 'Есть вопросы? Ответьте на это письмо, чтобы спросить %inviter%.'
    reason: 'Вы получили это письмо, потому что вас пригласил(а) %inviter%. Мы больше не напишем вам, если вы не зарегистрируетесь.'

enquiry:
    subject: 'Новая заявка от %name% через %host%'
    eyebrow: 'Новая заявка · %host%'
    heading: '%name% нужна помощь'
    intro: 'Кто-то только что заполнил форму обратной связи на вашем сайте. Вот что там написано:'
    details_title: 'Контакты'
    reply: 'Ответить: %name%'
    call: 'Позвонить: %name%'
    tip: 'Совет: клиенты обычно выбирают того, кто ответит первым. Быстрый ответ сегодня, даже просто «приеду посмотреть», очень важен.'
    admin: 'Эта заявка также есть в вашей панели.'
    admin_link: 'Открыть панель'
    reason: 'Вы получили это письмо, потому что кто-то заполнил форму обратной связи на %host%.'

review:
    subject: 'Новый отзыв: %name%'
    anonymous: 'Клиент'
    stars: '%rating% из 5 звёзд'
    eyebrow: 'Новый отзыв · %host%'
    heading: '%name%: %rating% из 5 звёзд'
    intro: 'Клиент оставил отзыв на вашем сайте:'
    intro_project: 'Клиент оставил отзыв о работе «%project%»:'
    publish_title: 'Пока не на сайте'
    publish_text: 'Вы сами решаете, какие отзывы показывать. Опубликуйте его в панели, в разделе «Отзывы».'
    cta: 'Открыть панель'
    reason: 'Вы получили это письмо, потому что кто-то оставил отзыв на %host%.'

review_request:
    preheader: 'Расскажите другим, как прошла работа. Это займёт минуту.'
    eyebrow: 'Ваше мнение'
    heading: 'Как поработал(а) %name%?'
    intro: 'Спасибо, что выбрали %name%! Расскажете другим, как прошла работа?'
    how: 'Оставьте отзыв с именем или анонимно. Это займёт минуту.'
    cta: 'Оставить отзыв'
    valid: 'Ссылка действует %days% дн. Кнопка не работает? Скопируйте эту ссылку в браузер:'
    reason: 'Вы получили это письмо, потому что %name% выполнил(а) для вас работу. Мы не добавим вас ни в какие рассылки.'

billing:
    eyebrow: 'Оплата'
    incl_vat: '%amount% (вкл. НДС %vat%%)'
    incl_vat_short: '%amount% (вкл. НДС)'
    total: 'Итого'
    outstanding: 'К оплате'

    setup:
        subject: 'Настройте оплату вашего сайта'
        preheader: 'Ваш сайт бесплатен до %date%. Один раз настройте способ оплаты, это займёт минуту.'
        heading: 'Добро пожаловать в %brand%!'
        intro: 'Здравствуйте, %name%! Ваш сайт бесплатен до %date%.'
        founding_title: 'Участник-основатель'
        founding_text: 'Как участник-основатель, вы получаете первый год бесплатно, а второй — со скидкой 50%.'
        yearly: 'После этого оплата списывается автоматически раз в год (12 месяцев по цене 10). Мы напишем вам за 2 недели до каждого годового платежа.'
        monthly: 'После этого оплата списывается автоматически 1-го числа каждого месяца.'
        once: 'Для этого один раз настройте способ оплаты. Это займёт минуту.'
        cta: 'Настроить оплату'
        how: 'Вы можете выбрать карту (мы только проверяем её, ничего не списывается) или банковский счёт (платёж в один цент привязывает его для автоматического списания).'

    reminder:
        cta: 'Оплатить сейчас'
        automatic: 'При оплате картой или через банк автоматическая оплата сразу настраивается и на будущее.'
        ignore: 'Уже всё решили? Тогда просто не обращайте внимания на это письмо.'
        first:
            subject: 'Ваш платёж %brand% не прошёл'
            preheader: 'Нам не удалось списать оплату автоматически. Оплатить онлайн можно за минуту.'
            heading: 'Платёж не прошёл'
            intro: 'Здравствуйте, %name%! Нам не удалось автоматически списать оплату за ваш сайт. Обычно так бывает, если срок карты истёк или её заменили.'
        second:
            subject: 'Напоминание: ваш платёж %brand% всё ещё не оплачен'
            preheader: 'Оплата за ваш сайт всё ещё не поступила. Оплатить онлайн можно за минуту.'
            heading: 'Платёж всё ещё не оплачен'
            intro: 'Здравствуйте, %name%! Напоминаем: оплата за ваш сайт всё ещё не поступила.'
        final:
            subject: 'Последнее напоминание: оплатите в течение недели, чтобы сайт остался онлайн'
            preheader: 'Оплатите до %date%, чтобы сайт остался онлайн.'
            heading: 'Последнее напоминание'
            intro: 'Здравствуйте, %name%! Это последнее напоминание: оплата за ваш сайт всё ещё не поступила.'
            warning_title: 'Сайт будет отключён %date%'
            warning_text: 'Пожалуйста, оплатите до %date%. Если к этому времени оплата не поступит, сайт будет автоматически отключён.'

    renewal:
        subject: 'Скоро годовой платёж %brand%'
        preheader: '%date% мы спишем оплату за следующий год.'
        heading: 'Скоро годовой платёж'
        intro: 'Здравствуйте, %name%! У вас годовой тариф %brand%: 12 месяцев по цене 10.'
        date: 'Дата платежа'
        period: 'Оплачиваемый период'
        months: '%count% месяц|%count% месяца|%count% месяцев'
        free_months: 'Из них бесплатно (приглашения)'
        nothing_to_do: 'Ничего делать не нужно'
        automatic: 'Оплата пройдёт автоматически: %method%.'
        change: 'Хотите использовать другую карту или счёт? Изменить можно здесь:'
        change_cta: 'Изменить способ оплаты'
        no_method: 'Способ оплаты ещё не настроен. Пожалуйста, настройте его до этой даты, чтобы сайт остался онлайн. Это займёт минуту.'

    suspended:
        subject: 'Ваш сайт отключён'
        preheader: 'Мы не получили оплату. Оплатите сейчас, и сайт сразу снова будет онлайн.'
        heading: 'Ваш сайт отключён'
        intro: 'Здравствуйте, %name%! Мы не получили оплату за ваш сайт, поэтому он отключён.'
        safe_title: 'Ваши данные в сохранности'
        safe_text: 'Посетители сейчас видят страницу «временно недоступно». Ничего не удалено.'
        back: 'Как только вы оплатите, сайт автоматически снова будет онлайн.'

    restored:
        subject: 'Спасибо, ваш сайт снова онлайн'
        preheader: 'Мы получили вашу оплату.'
        heading: 'Ваш сайт снова онлайн'
        intro: 'Здравствуйте, %name%! Спасибо, мы получили вашу оплату. Ваш сайт снова онлайн.'
        cta: 'Открыть сайт'

    invite_reward:
        subject: 'Вы получили бесплатный месяц'
        preheader: '%invitee% зарегистрировался по вашему приглашению.'
        eyebrow: 'Приглашения'
        heading: 'Вы получили бесплатный месяц'
        intro: 'Здравствуйте, %name%! Хорошие новости: %invitee% зарегистрировался по вашему приглашению и настроил оплату. Спасибо, что рекомендуете %brand%!'
        free_title: 'Один месяц бесплатно'
        free_text: 'Ваш следующий платёж покроет ещё один месяц без доплаты.'
        waiting: 'Сейчас у вас в запасе %count% бесплатный месяц|Сейчас у вас в запасе %count% бесплатных месяца|Сейчас у вас в запасе %count% бесплатных месяцев'
