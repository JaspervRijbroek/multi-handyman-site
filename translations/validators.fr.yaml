# French texts for the app's own validation messages on the sign-up form.
# Symfony's standard messages ("This value should not be blank.") are translated by Symfony itself.
'Enter a valid phone number.': Saisissez un numéro de téléphone valide.
'Choose at least one language.': Choisissez au moins une langue.
'Use at least {{ limit }} characters.': Utilisez au moins {{ limit }} caractères.
'Please agree to the terms and privacy policy, otherwise we cannot set up your website.': 'Veuillez accepter les conditions et la politique de confidentialité, sinon nous ne pouvons pas créer votre site.'
'The passwords do not match.': Les mots de passe ne correspondent pas.
'This domain is already used by another website. Check the spelling, or leave it empty and tell us in the message.': 'Ce domaine est déjà utilisé par un autre site. Vérifiez l’orthographe, ou laissez-le vide et indiquez-le-nous dans le message.'
