    faq_title: Vragen die we vaak krijgen
    faq1_q: Wat betekent “vindbaar door AI-assistenten” eigenlijk?
    faq1_a: 'Steeds meer mensen vragen ChatGPT, Gemini, Claude of Perplexity dingen als “zoek een Nederlandstalige loodgieter bij Jávea”. Die assistenten lezen websites om te antwoorden. Jouw site geeft ze duidelijke, gestructureerde feiten — wat je doet, waar je werkt, hoe ze je bereiken — zodat ze je met vertrouwen kunnen aanraden in plaats van te gokken.'
    faq2_q: Zijn er opstartkosten of is er een lang contract?
    faq2_a: Geen opstartkosten en geen contract. Eén prijs voor de website, hosting, de Google-koppeling en doorlopende SEO. Betaal per maand en zeg elke maand op, of betaal een jaar vooruit en krijg twee maanden gratis. We mailen je twee weken voor elke jaarbetaling.
    faq3_q: Moet ik iets van websites weten?
    faq3_a: Nee. Wij bouwen de site, koppelen je domein en regelen Google voor je. Daarna kun je je diensten bijwerken en foto’s van recent werk toevoegen in een eenvoudige beheeromgeving — of je stuurt ze gewoon naar ons.
    faq4_q: Kan ik mijn eigen domeinnaam gebruiken?
    faq4_a: Ja. Neem het domein mee dat je al hebt, of we helpen je er een te registreren. HTTPS is inbegrepen en werkt vanaf het eerste bezoek.
    faq5_q: Welke talen worden ondersteund?
    faq5_a: Engels, Spaans, Nederlands, Duits en Frans. Kies de talen die je klanten spreken; elke taal krijgt eigen pagina’s, zodat Google en AI-assistenten de juiste versie aan de juiste persoon tonen.
    faq6_q: Is het legaal voor een bedrijf in Spanje?
    faq6_a: Elke site heeft een juridische vermelding en privacypagina (LSSI en AVG), gemaakt op basis van je bedrijfsgegevens, en er is geen cookiebanner nodig. We raden wel aan om de teksten door je gestor te laten controleren.
    final_title: Klaar wanneer jij dat bent.
    final_text: Aanmelden duurt ongeveer vijf minuten. We controleren je gegevens en je website staat meestal binnen twee werkdagen online. €%price% per maand, of twee maanden gratis met het jaarabonnement.

