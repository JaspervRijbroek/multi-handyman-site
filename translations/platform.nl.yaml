terms:
    title: Algemene voorwaarden
    scope_title: 1. Toepassing
    scope_text: |-
        Deze voorwaarden gelden voor de websitedienst %brand%, geleverd door %name% ("wij", "ons") aan bedrijven en zelfstandige professionals ("jij").

        %brand% is alleen voor professionals. Door je aan te melden bevestig je dat je handelt voor je bedrijf of beroep, niet als consument. Regels voor consumentenbescherming, zoals het herroepingsrecht, gelden daarom niet.
    service_title: 2. De dienst
    service_text: |-
        We bouwen en hosten een website voor je bedrijf, op een subdomein van %brand% of op je eigen domein. De dienst omvat hosting, HTTPS, een eenvoudige beheeromgeving om je site te bewerken, een contactformulier, klantreviews, een juridische vermelding en privacypagina, de koppeling met Google Search Console en een vermelding in de zoekfunctie van %brand% voor professionals.

        We kunnen functies in de loop van de tijd verbeteren of wijzigen. We verwijderen geen belangrijke functie zonder het je eerst te laten weten.

        We kunnen geen positie in Google of andere zoekmachines garanderen, en ook geen aantal aanvragen of klussen.
    account_title: 3. Aanmelding en je account
    account_text: |-
        Nadat je je hebt aangemeld, controleren we je gegevens. We kunnen een aanmelding weigeren zonder reden te geven. Het contract begint wanneer we je aanmelding goedkeuren en je de welkomstmail sturen.

        Zorg dat je gegevens kloppen en houd ze actueel. Houd je wachtwoord en een eventueel token voor een AI-assistent geheim: je bent verantwoordelijk voor alles wat met je login of token gebeurt.
    price_title: 4. Prijs en betaling
    price_text: |-
        De prijs is de prijs die op onze website stond toen je je aanmeldde, tenzij we een andere prijs met je hebben afgesproken. Prijzen zijn exclusief btw, die tegen het geldende tarief wordt toegevoegd.

        Je website is gratis tot de 1e van de maand nadat we hem hebben opgezet. Daarna:
        - Maandabonnement: vooraf betaald op de 1e van elke maand.
        - Jaarabonnement: 12 maanden voor de prijs van 10, eenmaal per jaar vooraf betaald. We mailen je twee weken voor elke jaarbetaling.

        Betalingen worden automatisch geïnd door onze betaalprovider Mollie (kaart of SEPA-incasso). Je krijgt voor elke betaling een factuur.

        Als een betaling mislukt, sturen we herinneringen met een betaallink. Is het een week na de laatste herinnering (ongeveer vijf weken na de betaaldatum) nog steeds niet betaald, dan halen we je website offline tot het bedrag is betaald. Je beheeromgeving blijft beschikbaar.

        We kunnen de prijs wijzigen. We laten het je minstens 30 dagen vooraf per e-mail weten; de nieuwe prijs geldt vanaf je volgende betaalperiode. Ga je niet akkoord, dan kun je vóór die tijd opzeggen.
    cancel_title: 5. Looptijd en opzegging
    cancel_text: |-
        Er is geen minimale looptijd. Je kunt op elk moment opzeggen per e-mail aan %email%.

        Maandabonnement: de dienst eindigt aan het einde van de maand die je al hebt betaald. Er wordt niets meer afgeschreven.

        Jaarabonnement: de dienst eindigt aan het einde van het jaar dat je al hebt betaald. Jaarbetalingen worden niet terugbetaald, ook niet gedeeltelijk, als je tijdens het jaar opzegt. Zeg op vóór de volgende jaarbetaling om die te voorkomen.

        Wij kunnen het contract beëindigen met een opzegtermijn van 30 dagen per e-mail. Doen we dat, dan betalen we de maanden terug die je hebt betaald maar niet gebruikt. We kunnen het direct beëindigen als je deze voorwaarden ernstig schendt, bijvoorbeeld door onwettige inhoud te publiceren of niet te betalen.
    content_title: 6. Je inhoud
    content_text: |-
        Je bent verantwoordelijk voor alles op je website: teksten, foto’s, prijzen, contact- en bedrijfsgegevens, en de gegevens in je juridische vermelding (naam, fiscaal nummer, adres). Je bevestigt dat je de teksten en foto’s mag gebruiken, en dat je website en je bedrijf aan de wet voldoen.

        De juridische vermelding en privacypagina die wij maken, zijn sjablonen. Laat ze controleren door je gestor of advocaat.

        Reviews moeten van echte klanten komen. Je mag geen reviews zelf schrijven, laten schrijven of iets aanbieden in ruil voor goede reviews.

        Je blijft eigenaar van je inhoud. Je geeft ons toestemming om die op te slaan, te kopiëren en te tonen om je website te laten draaien, en om je bedrijfsnaam, plaats, vakken en beoordeling te tonen in de zoekfunctie van %brand%.

        We kunnen inhoud verwijderen of je website offline halen als die duidelijk onwettig is of anderen schaadt, of als een overheidsinstantie ons daartoe verplicht. Waar mogelijk nemen we eerst contact met je op.

        Gebruik je je eigen domein, dan blijf je daarvan eigenaar en ben je verantwoordelijk voor de registratie en DNS. Het subdomein van %brand% blijft van ons.
    availability_title: 7. Beschikbaarheid
    availability_text: |-
        We doen ons best om je website online en veilig te houden, en we maken regelmatig back-ups. We kunnen niet beloven dat de dienst altijd beschikbaar of foutloos is. Onderhoud kan korte onderbrekingen veroorzaken. Bewaar zelf een kopie van belangrijke teksten en foto’s.
    liability_title: 8. Aansprakelijkheid
    liability_text: |-
        Onze totale aansprakelijkheid is beperkt tot het bedrag dat je ons hebt betaald in de 12 maanden voordat de schade ontstond. We zijn niet aansprakelijk voor indirecte schade, zoals gemiste klussen, gederfde winst of verloren gegevens, of voor de diensten van andere bedrijven zoals Google, Mollie of je domeinregistrar.

        Deze beperkingen gelden niet voor schade die opzettelijk of door grove nalatigheid is veroorzaakt.
    processing_title: 9. Verwerking van persoonsgegevens voor jou (AVG artikel 28)
    processing_text: |-
        Je website verzamelt persoonsgegevens van je klanten en bezoekers, bijvoorbeeld berichten via het contactformulier, reviews en contactgegevens die je invoert om een reviewlink te sturen. Voor deze gegevens ben jij de verwerkingsverantwoordelijke en zijn wij je verwerker. Dit artikel is de verwerkersovereenkomst tussen ons.

        We verwerken deze gegevens alleen om je website en beheeromgeving te laten draaien zoals in deze voorwaarden beschreven, en volgens je gedocumenteerde instructies (je gebruik van de beheeromgeving geldt als zodanig). We gebruiken ze nergens anders voor en verkopen ze niet.

        Iedereen bij %brand% die toegang heeft tot de gegevens, is tot geheimhouding verplicht.

        We nemen passende beveiligingsmaatregelen: HTTPS, logins met een wachtwoord, scheiding van de gegevens van elke klant, regelmatige updates en back-ups.

        Je geeft ons algemene toestemming om de subverwerkers te gebruiken die in ons privacybeleid staan (%privacy_url%). We laten het je minstens 30 dagen vooraf per e-mail weten voordat we er een toevoegen of vervangen; heb je bezwaar, dan kun je opzeggen.

        We helpen je om te reageren op verzoeken van mensen die hun AVG-rechten uitoefenen, en om aan je andere AVG-verplichtingen te voldoen, voor zover dat redelijk is. De meeste gegevens kun je zelf inzien, wijzigen en verwijderen in de beheeromgeving.

        We informeren je zonder onnodige vertraging nadat we op de hoogte zijn geraakt van een datalek dat je gegevens betreft.

        Wanneer het contract eindigt, verwijderen we de gegevens zoals beschreven in artikel 10, tenzij de wet ons verplicht ze te bewaren. Op verzoek geven we je de informatie die je nodig hebt om aan te tonen dat aan deze verplichtingen is voldaan.
    end_title: 10. Wanneer het contract eindigt
    end_text: |-
        We verwijderen je website, je beheeromgeving en alle inhoud, inclusief de gegevens van je klanten, 30 dagen nadat het contract is geëindigd. Staat je website offline vanwege een onbetaald bedrag, dan verwijderen we hem ook na 30 dagen offline, en eindigt het contract.

        Daarvoor kun je ons per e-mail om een kopie van je teksten, foto’s, aanvragen en reviews vragen. Facturen en betaalgegevens bewaren we zo lang als de belastingwet vereist.
    changes_title: 11. Wijzigingen in deze voorwaarden
    changes_text: |-
        We kunnen deze voorwaarden wijzigen. We mailen je de nieuwe voorwaarden minstens 30 dagen voordat ze gelden. Ga je niet akkoord, dan kun je vóór die tijd opzeggen; blijf je de dienst gebruiken, dan gelden de nieuwe voorwaarden.
    law_title: 12. Recht en geschillen
    law_text: |-
        Op deze voorwaarden is Spaans recht van toepassing. Geschillen worden voorgelegd aan de rechter van de plaats waar %name% woont, tenzij de wet anders bepaalt. Vragen of klachten? Mail eerst %email%; we proberen het samen op te lossen.

privacy:
    title: Privacybeleid
    scope_title: 1. Waar dit beleid over gaat
    scope_text: |-
        Dit beleid legt uit hoe %name% ("wij") omgaat met persoonsgegevens op het platform %brand%: de zoekfunctie voor professionals, het aanmeldformulier en de accounts van de professionals die %brand% gebruiken voor hun website. Wij zijn de verwerkingsverantwoordelijke voor deze gegevens. Vragen over je gegevens: %email%.

        Het gaat niet over de websites van onze klanten. Elke professional is verantwoordelijk voor de gegevens op zijn eigen website (zie de juridische vermelding op die website). Wij verwerken die gegevens namens hen, zoals beschreven in artikel 9 van onze voorwaarden (%terms_url%).
    data_title: 2. Welke gegevens we gebruiken
    data_text: |-
        Als je je aanmeldt als professional: je bedrijfsnaam, je naam, e-mailadres, telefoon- en WhatsApp-nummer, adres, fiscaal nummer, werkgebied, talen, domeinnaam, je bericht aan ons, je wachtwoord (alleen versleuteld opgeslagen, als hash) en de datum waarop je onze voorwaarden hebt geaccepteerd.

        Als je klant bent: je abonnement, betalingen en facturen. Betalingen lopen via Mollie: we zien nooit je volledige kaart- of bankgegevens, alleen een korte omschrijving zoals het kaartmerk en de laatste cijfers of een deel van je IBAN.

        Als je een professional zoekt: het vak en de plaats waarop je zoekt. Je IP-adres wordt korte tijd gebruikt om onze formulieren en zoekfunctie tegen misbruik te beschermen.

        Als je ons mailt: je e-mailadres en wat je schrijft.
    purposes_title: 3. Waarom we ze gebruiken, en op welke rechtsgrond
    purposes_text: |-
        - Om je aanmelding te controleren, je website te bouwen en te laten draaien, je account te beheren en je e-mails over de dienst te sturen: om ons contract met je uit te voeren (AVG artikel 6, lid 1, onder b).
        - Om je te factureren en onze boekhouding bij te houden: een wettelijke verplichting onder Spaans belasting- en handelsrecht (artikel 6, lid 1, onder c).
        - Om je bedrijf te tonen in de zoekfunctie van %brand%: onderdeel van de dienst, dus ons contract (artikel 6, lid 1, onder b).
        - Om het platform veilig te houden en spam en misbruik te stoppen: ons gerechtvaardigd belang (artikel 6, lid 1, onder f).

        We verkopen je gegevens niet, gebruiken ze niet voor reclame en nemen geen geautomatiseerde besluiten over je.
    recipients_title: 4. Met wie we gegevens delen
    recipients_text: |-
        We delen gegevens alleen met bedrijven die ons helpen de dienst te leveren (subverwerkers), en alleen wat zij nodig hebben:
        - Hetzner Online GmbH, Duitsland: hosting van het platform en alle websites.
        - Mollie B.V., Nederland: betalingen.
        - FacturaDirecta (Spanje): facturen.
        - Cloudflare, Inc., VS: de spamcontrole (Turnstile) op formulieren.
        - Google LLC, VS: het instellen van Google Search Console voor je website.
        - OpenStreetMap Foundation, Verenigd Koninkrijk: adressen en plaatsen omzetten in posities op de kaart (Nominatim).
        - Plausible Insights OÜ, Estland: bezoekersstatistieken zonder cookies op klantwebsites die het gebruiken.
        - Onze e-mailprovider, voor het versturen van e-mails vanaf het platform en de websites.

        Als je met je eigen token een AI-assistent aan je beheeromgeving koppelt, gaan de gegevens die de assistent leest naar het bedrijf achter die assistent. Dat is jouw keuze en valt onder je afspraak met dat bedrijf.

        We delen ook gegevens als de wet dat vereist, bijvoorbeeld met de belastingdienst.
    transfers_title: 5. Gegevens buiten de EU
    transfers_text: |-
        Cloudflare en Google zijn gevestigd in de VS. Ze zijn gecertificeerd onder het EU-VS Data Privacy Framework en gebruiken ook de standaardcontractbepalingen van de Europese Commissie. Voor het Verenigd Koninkrijk heeft de Europese Commissie een adequaatheidsbesluit genomen.
    retention_title: 6. Hoe lang we gegevens bewaren
    retention_text: |-
        - Account- en websitegegevens: zolang je klant bent, plus 30 dagen (zie artikel 10 van onze voorwaarden).
        - Aanmeldingen die we niet goedkeuren: verwijderd binnen 3 maanden.
        - Facturen en betaalgegevens: 6 jaar, zoals het Spaanse handelsrecht vereist.
        - IP-adressen voor bescherming tegen misbruik: hooguit een paar uur. Serverlogs: hooguit 30 dagen.
        - E-mails: zolang nodig om je te helpen, hooguit 2 jaar na ons laatste contact.
    cookies_title: 7. Cookies
    cookies_text: |-
        Het platform gebruikt alleen één cookie die nodig is om ingelogd te blijven in de beheeromgeving. Die wordt verwijderd als je uitlogt of je browser sluit. We gebruiken geen tracking- of advertentiecookies, dus er is geen cookiebanner. De spamcontrole van Cloudflare op onze formulieren leest technische gegevens van je browser, maar volgt je niet over websites heen.
    rights_title: 8. Je rechten
    rights_text: |-
        Je kunt ons vragen je gegevens in te zien, te corrigeren of te verwijderen, het gebruik ervan te beperken, of ze in een gangbaar formaat te ontvangen, en je kunt bezwaar maken tegen het gebruik ervan. De meeste accountgegevens kun je zelf wijzigen in de beheeromgeving. Mail %email%; we antwoorden binnen een maand.

        Je kunt ook een klacht indienen bij de Spaanse toezichthouder voor gegevensbescherming (Agencia Española de Protección de Datos, www.aepd.es).
