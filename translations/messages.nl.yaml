legal:
    title: Juridische informatie & privacy
    owner:
        title: Wie deze website beheert
        text: 'Volgens de Spaanse wet (Ley 34/2002, LSSI) is de eigenaar van %site%:'
        name: Eigenaar
        tax_id: Fiscaal nummer (NIF/NIE/CIF)
        address: Adres
        phone: Telefoon
        email: E-mail
    privacy:
        title: Privacybeleid
        controller: '%owner% is verantwoordelijk voor de persoonsgegevens die je via deze website verstuurt.'
        purpose: We gebruiken de gegevens uit het contactformulier alleen om je vraag te beantwoorden en, als je dat wilt, een offerte te maken. De grondslag is je toestemming en het nemen van stappen op jouw verzoek voordat een overeenkomst wordt gesloten. We verkopen of delen je gegevens niet, behalve met partijen die deze website en de e-mail namens ons hosten. Om spam tegen te houden is het contactformulier beveiligd met Cloudflare Turnstile, dat je browser controleert zonder trackingcookies.
        retention: We bewaren je bericht zolang nodig is om het af te handelen en om aan wettelijke verplichtingen te voldoen.
        reviews: Als je een review schrijft, publiceren we na controle je voornaam, woonplaats (indien ingevuld), beoordeling en review op deze website. Je kunt ons altijd vragen die te verwijderen. Als we een klus voor je hebben gedaan en je ons je e-mailadres of telefoonnummer hebt gegeven, gebruiken we dat om je een link te sturen om die klus te beoordelen; we verwijderen het zodra je je review hebt achtergelaten.
        rights: 'Je kunt inzage, correctie of verwijdering van je gegevens vragen, of bezwaar maken tegen het gebruik ervan, door te mailen naar %email%. Je kunt ook een klacht indienen bij de Spaanse privacytoezichthouder (www.aepd.es).'
    cookies:
        title: Cookies
        text: Deze website gebruikt geen tracking- of advertentiecookies. Alleen bij gebruik van het contactformulier wordt een technische sessiecookie geplaatst, ter bescherming tegen misbruik. Bezoekersstatistieken worden, als ze aanstaan, anoniem en zonder cookies verzameld.
        map: De kaart bij contact wordt pas van OpenStreetMap (OpenStreetMap Foundation, Verenigd Koninkrijk) geladen als je op “Kaart tonen” klikt; je IP-adres gaat dan naar hun servers om de kaart te laden. OpenStreetMap gebruikt geen advertentie- of trackingcookies.

