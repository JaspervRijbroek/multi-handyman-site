        change_cta: 'Changer de moyen de paiement'
        no_method: 'Aucun moyen de paiement n’est encore configuré. Configurez-en un avant cette date pour que votre site reste en ligne. Cela prend une minute.'

    suspended:
        subject: 'Votre site a été mis hors ligne'
        preheader: 'Nous n’avons pas reçu votre paiement. Payez maintenant et votre site revient aussitôt en ligne.'
        heading: 'Votre site est hors ligne'
        intro: 'Bonjour %name%, comme nous n’avons pas reçu le paiement de votre site, il a été mis hors ligne.'
        safe_title: 'Votre contenu est en sécurité'
        safe_text: 'Les visiteurs voient maintenant une page "temporairement indisponible". Rien n’a été supprimé.'
        back: 'Dès que vous payez, votre site revient automatiquement en ligne.'

    restored:
        subject: 'Merci, votre site est de nouveau en ligne'
        preheader: 'Nous avons bien reçu votre paiement.'
        heading: 'Votre site est de nouveau en ligne'
        intro: 'Bonjour %name%, merci, nous avons bien reçu votre paiement. Votre site est de nouveau en ligne.'
        cta: 'Voir votre site'

    invite_reward:
        subject: 'Vous avez gagné un mois offert'
        preheader: '%invitee% s’est inscrit avec votre invitation.'
        eyebrow: 'Invitations'
        heading: 'Vous avez gagné un mois offert'
        intro: 'Bonjour %name%, bonne nouvelle : %invitee% s’est inscrit avec votre invitation et a configuré son paiement. Merci de recommander %brand% !'
        free_title: 'Un mois offert'
        free_text: 'Votre prochain paiement couvre un mois supplémentaire sans frais en plus.'
        waiting: 'Vous avez maintenant %count% mois offerts en attente.'
