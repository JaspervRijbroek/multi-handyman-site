    domain_after: 'Dès que cela fonctionne (en général en quelques heures), votre site passe tout seul à https://%domain%, avec HTTPS. Votre adresse actuelle continue de fonctionner et redirige les visiteurs. Suivez l’avancement dans votre espace, sous "Votre domaine".'
    google: 'Nous relions aussi votre site à Google Search Console. Cela se fait automatiquement dès que votre site est en ligne.'

invitation:
    subject: '%inviter% vous invite sur %brand%'
    preheader: 'Un site professionnel pour votre entreprise, et votre deuxième mois est offert.'
    eyebrow: 'Une invitation'
    heading: 'Bonjour %name%,'
    intro: '%inviter% utilise %brand% pour son site et vous invite à l’essayer aussi.'
    what: '%brand% offre à votre entreprise un site professionnel en plusieurs langues, avec formulaire de contact, avis et WhatsApp, que vous modifiez facilement vous-même.'
    offer_title: 'Votre deuxième mois est offert'
    offer_text: 'Inscrivez-vous avec votre lien personnel ci-dessous. Le lien fonctionne une seule fois.'
    cta: 'M’inscrire'
    questions: 'Des questions ? Répondez à cet e-mail pour demander à %inviter%.'
    reason: 'Vous recevez cet e-mail parce que %inviter% vous a invité. Nous ne vous écrirons plus, sauf si vous vous inscrivez.'

enquiry:
    subject: 'Nouvelle demande de %name% via %host%'
    eyebrow: 'Nouvelle demande · %host%'
    heading: '%name% a besoin d’un coup de main'
    intro: 'Quelqu’un vient d’utiliser le formulaire de contact de votre site. Voici son message :'
    details_title: 'Coordonnées'
    reply: 'Répondre à %name%'
    call: 'Appeler %name%'
