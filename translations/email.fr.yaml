    admin: 'Vous retrouvez aussi cette demande dans votre espace.'
    admin_link: 'Ouvrir votre espace'
    reason: 'Vous recevez cet e-mail parce que quelqu’un a utilisé le formulaire de contact de %host%.'

review:
