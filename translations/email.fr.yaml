    password_chosen: 'Celui que vous avez choisi à l’inscription'
    setup_password: 'Choisissez d’abord votre mot de passe. Le lien est valable 7 jours.'
    setup_cta: 'Choisir mon mot de passe'
    cta: 'Ouvrir votre espace'
    next_title: 'Trois choses pour être trouvé plus facilement'
    step1_title: 'Ajoutez des photos de votre travail'
    step1_text: 'Les photos avant-après fonctionnent le mieux. Quelques bonnes photos valent mieux que beaucoup de floues.'
    step2_title: 'Vérifiez vos services et votre zone d’intervention'
    step2_text: 'Ils déterminent dans quelles recherches vous apparaissez.'
    step3_title: 'Partagez votre lien'
    step3_text: 'Mettez votre site sur votre page Facebook, votre profil WhatsApp et votre camionnette.'
    domain_title: 'Utiliser votre propre domaine %domain%'
