    reason: 'Vous recevez cet e-mail parce que %name% a réalisé un travail pour vous. Nous ne vous ajouterons à aucune liste de diffusion.'

billing:
    eyebrow: 'Paiement'
    incl_vat: '%amount% (TVA %vat% % incl.)'
    incl_vat_short: '%amount% (TVA incl.)'
    total: 'Total'
    outstanding: 'À payer'

    setup:
        subject: 'Configurez le paiement de votre site'
        preheader: 'Votre site est gratuit jusqu’au %date%. Configurez une fois un moyen de paiement, cela prend une minute.'
        heading: 'Bienvenue sur %brand% !'
        intro: 'Bonjour %name%, votre site est gratuit jusqu’au %date%.'
        founding_title: 'Membre fondateur'
        founding_text: 'En tant que membre fondateur, votre première année est offerte et la deuxième à moitié prix.'
        yearly: 'Ensuite, le prélèvement est automatique une fois par an (12 mois au prix de 10). Nous vous écrivons 2 semaines avant chaque paiement annuel.'
        monthly: 'Ensuite, le prélèvement est automatique le 1er de chaque mois.'
        once: 'Pour cela, configurez une fois un moyen de paiement. Cela prend une minute.'
        cta: 'Configurer le paiement'
        how: 'Vous choisissez une carte (nous la vérifions seulement, rien n’est débité) ou votre compte bancaire (un paiement d’un centime le relie pour le prélèvement).'

    reminder:
        cta: 'Payer maintenant'
        automatic: 'En payant par carte ou par votre banque, le paiement automatique est aussi configuré pour la suite.'
        ignore: 'Déjà réglé ? Vous pouvez ignorer cet e-mail.'
        first:
            subject: 'Votre paiement à %brand% n’a pas abouti'
            preheader: 'Nous n’avons pas pu encaisser votre paiement automatiquement. Vous pouvez payer en ligne en une minute.'
            heading: 'Votre paiement n’a pas abouti'
            intro: 'Bonjour %name%, nous n’avons pas pu encaisser automatiquement le paiement de votre site. Cela arrive souvent quand une carte a expiré ou a été remplacée.'
        second:
            subject: 'Rappel : votre paiement à %brand% est toujours en attente'
            preheader: 'Le paiement de votre site est toujours en attente. Vous pouvez payer en ligne en une minute.'
            heading: 'Votre paiement est toujours en attente'
            intro: 'Bonjour %name%, petit rappel : le paiement de votre site est toujours en attente.'
        final:
            subject: 'Dernier rappel : payez sous une semaine pour garder votre site en ligne'
            preheader: 'Merci de payer avant le %date% pour garder votre site en ligne.'
            heading: 'Dernier rappel'
            intro: 'Bonjour %name%, ceci est votre dernier rappel : le paiement de votre site est toujours en attente.'
            warning_title: 'Votre site sera mis hors ligne le %date%'
            warning_text: 'Merci de payer avant le %date%. Si nous n’avons rien reçu d’ici là, votre site sera mis hors ligne automatiquement.'

    renewal:
        subject: 'Votre paiement annuel à %brand% approche'
        preheader: 'Le %date%, nous prélevons le paiement de l’année à venir.'
        heading: 'Votre paiement annuel approche'
        intro: 'Bonjour %name%, vous avez la formule annuelle de %brand% : 12 mois au prix de 10.'
        date: 'Date du paiement'
        period: 'Période payée'
        months: '%count% mois|%count% mois'
        free_months: 'Dont offerts (invitations)'
        nothing_to_do: 'Rien à faire'
        automatic: 'Le paiement se fait automatiquement avec %method%.'
