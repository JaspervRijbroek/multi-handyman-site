    more10: Хостинг, резервные копии и обновления
    whatsapp: Задать вопрос в WhatsApp
    faq_eyebrow: Вопросы и ответы
    faq_title: Частые вопросы
    faq1_q: Что на самом деле значит «вас находят ИИ-ассистенты»?
    faq1_a: 'Всё больше людей спрашивают ChatGPT, Gemini, Claude или Perplexity, например: «найди сантехника рядом с Хавеей, который говорит по-русски». Чтобы ответить, ассистенты читают сайты. Ваш сайт даёт им чёткие структурированные факты — что вы делаете, где работаете, как с вами связаться, — поэтому они могут уверенно рекомендовать вас, а не гадать.'
    faq2_q: Есть ли плата за подключение или долгий договор?
    faq2_a: Нет платы за подключение и нет договора. Одна цена покрывает сайт, хостинг, настройку Google и постоянное SEO. Платите помесячно и отменяйте в любой месяц или оплатите год вперёд и получите два месяца в подарок. Мы пишем вам за две недели до каждого годового платежа.
    faq3_q: Нужно ли что-то знать о сайтах?
    faq3_a: Нет. Мы создаём сайт, подключаем ваш домен и настраиваем Google за вас. Потом вы можете обновлять услуги и добавлять фото последних работ в простой панели управления — или просто прислать их нам.
    faq4_q: Можно ли использовать свой домен?
    faq4_a: Да. Используйте домен, который у вас уже есть, или мы поможем зарегистрировать новый. HTTPS включён и работает с первого посещения.
    faq5_q: Какие языки поддерживаются?
    faq5_a: Английский, испанский, нидерландский, немецкий, французский и русский. Выберите языки, на которых говорят ваши клиенты; у каждого свои страницы, чтобы Google и ИИ-ассистенты показывали нужную версию нужному человеку.
    faq6_q: Законно ли это для бизнеса в Испании?
    faq6_a: Каждый сайт получает страницу с правовой информацией и политикой конфиденциальности (LSSI и GDPR), созданную по данным вашего бизнеса, и баннер о cookie не нужен. Всё же рекомендуем, чтобы ваш gestor проверил тексты.
    final_title: Готовы, когда вы готовы.
    final_text: Регистрация занимает около пяти минут. Мы проверяем ваши данные, и обычно сайт запускается в течение двух рабочих дней. €%price% в месяц или два месяца в подарок с годовым тарифом.

