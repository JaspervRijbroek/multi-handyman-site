terms:
    title: Условия использования
    scope_title: 1. Сфера действия
    scope_text: |-
        Эти условия применяются к сервису сайтов %brand%, который %name% («мы») предоставляет предприятиям и самозанятым специалистам («вы»).

        %brand% предназначен только для профессионалов. Регистрируясь, вы подтверждаете, что действуете в интересах своего бизнеса или профессии, а не как потребитель. Поэтому правила защиты прав потребителей, например право на отказ от договора, не применяются.
    service_title: 2. Сервис
    service_text: |-
        Мы создаём и размещаем сайт для вашего бизнеса на поддомене %brand% или на вашем собственном домене. Сервис включает хостинг, HTTPS, простую панель управления для редактирования сайта, контактную форму, отзывы клиентов, страницу с правовой информацией и политикой конфиденциальности, настройку Google Search Console и размещение в поиске специалистов %brand%.

        Со временем мы можем улучшать или менять функции. Мы не уберём основную функцию, не предупредив вас заранее.

        Мы не можем гарантировать позицию в Google или других поисковых системах, а также количество запросов или заказов.
    account_title: 3. Регистрация и ваш аккаунт
    account_text: |-
        После регистрации мы проверяем ваши данные. Мы можем отказать в регистрации без объяснения причин. Договор начинает действовать, когда мы одобряем вашу регистрацию и отправляем вам приветственное письмо.

        Следите за тем, чтобы ваши данные были верными и актуальными. Храните в тайне свой пароль и любой токен ИИ-ассистента: вы отвечаете за всё, что делается с вашим логином или токеном.
    price_title: 4. Цена и оплата
    price_text: |-
        Действует цена, указанная на нашем сайте в момент вашей регистрации, если мы не договорились с вами о другой. Цены указаны без НДС, который добавляется по действующей ставке.

        Ваш сайт бесплатен до 1-го числа месяца, следующего за месяцем его настройки. После этого:
        - Помесячный тариф: оплата вперёд 1-го числа каждого месяца.
        - Годовой тариф: 12 месяцев по цене 10, оплата вперёд раз в год. Мы пишем вам за две недели до каждого годового платежа.

        Платежи автоматически списывает наш платёжный провайдер Mollie (карта или прямое дебетование SEPA). За каждый платёж вы получаете счёт.

        Если платёж не прошёл, мы отправляем напоминания со ссылкой для оплаты. Если сумма не оплачена через неделю после последнего напоминания (примерно через пять недель после даты платежа), мы отключаем ваш сайт до оплаты. Панель управления остаётся доступной.

        Мы можем изменить цену. Мы сообщим об этом по email не менее чем за 30 дней; новая цена действует со следующего периода оплаты. Если вы не согласны, вы можете отказаться от сервиса до этого момента.
    cancel_title: 5. Срок действия и отмена
    cancel_text: |-
        Минимального срока нет. Вы можете отменить сервис в любой момент, написав на %email%.

        Помесячный тариф: сервис заканчивается в конце уже оплаченного месяца. Новых списаний не будет.

        Годовой тариф: сервис заканчивается в конце уже оплаченного года. Годовые платежи не возвращаются, в том числе частично, если вы отменяете сервис в течение года. Чтобы избежать следующего годового платежа, отмените сервис до его даты.

        Мы можем расторгнуть договор, уведомив вас по email за 30 дней. В этом случае мы вернём деньги за оплаченные, но неиспользованные месяцы. Мы можем расторгнуть договор немедленно, если вы серьёзно нарушаете эти условия, например публикуете незаконный контент или не платите.
    content_title: 6. Ваш контент
    content_text: |-
        Вы отвечаете за всё на своём сайте: тексты, фото, цены, контактные и деловые данные, а также данные в правовой информации (имя, налоговый номер, адрес). Вы подтверждаете, что имеете право использовать эти тексты и фото и что ваш сайт и бизнес соответствуют закону.

        Страница с правовой информацией и политикой конфиденциальности, которую мы создаём, — это шаблон. Попросите вашего gestor или юриста проверить её.

        Отзывы должны быть от настоящих клиентов. Нельзя писать отзывы самому, заказывать их или предлагать что-либо взамен хороших отзывов.

        Вы остаётесь владельцем своего контента. Вы разрешаете нам хранить, копировать и показывать его для работы вашего сайта, а также показывать название вашего бизнеса, город, профессии и оценку в поиске %brand%.

        Мы можем удалить контент или отключить ваш сайт, если он явно незаконен или вредит другим, либо если этого требует государственный орган. По возможности мы сначала связываемся с вами.

        Если вы используете собственный домен, вы остаётесь его владельцем и отвечаете за его регистрацию и DNS. Поддомен %brand% остаётся нашим.
    availability_title: 7. Доступность
    availability_text: |-
        Мы делаем всё возможное, чтобы ваш сайт работал и был защищён, и регулярно создаём резервные копии. Мы не можем обещать, что сервис всегда будет доступен и без ошибок. Техническое обслуживание может вызывать короткие перерывы. Храните собственную копию важных текстов и фото.
    liability_title: 8. Ответственность
    liability_text: |-
        Наша общая ответственность ограничена суммой, которую вы заплатили нам за 12 месяцев до возникновения ущерба. Мы не отвечаем за косвенный ущерб, например упущенные заказы, упущенную прибыль или потерянные данные, а также за услуги других компаний, таких как Google, Mollie или ваш регистратор доменов.

        Эти ограничения не применяются к ущербу, причинённому умышленно или по грубой неосторожности.
    processing_title: 9. Обработка персональных данных по вашему поручению (статья 28 GDPR)
    processing_text: |-
        Ваш сайт собирает персональные данные ваших клиентов и посетителей, например сообщения через контактную форму, отзывы и контактные данные, которые вы вводите, чтобы отправить ссылку для отзыва. Для этих данных вы являетесь контролёром, а мы — вашим обработчиком. Этот раздел является соглашением об обработке данных между нами.

        Мы обрабатываем эти данные только для работы вашего сайта и панели управления, как описано в этих условиях, и по вашим документированным указаниям (ваше использование панели управления считается таковым). Мы не используем их ни для чего другого и не продаём.

        Все сотрудники %brand%, имеющие доступ к данным, обязаны соблюдать конфиденциальность.

        Мы принимаем надлежащие меры безопасности: HTTPS, вход по паролю, разделение данных каждого клиента, регулярные обновления и резервные копии.

        Вы даёте нам общее разрешение привлекать субобработчиков, перечисленных в нашей политике конфиденциальности (%privacy_url%). Мы сообщаем вам по email не менее чем за 30 дней, прежде чем добавить или заменить одного из них; если вы возражаете, вы можете отказаться от сервиса.

        Мы помогаем вам отвечать на запросы людей, которые пользуются своими правами по GDPR, и выполнять другие обязанности по GDPR, насколько это разумно. Большинство данных вы можете просматривать, изменять и удалять сами в панели управления.

        Мы без неоправданной задержки сообщаем вам, если узнаём об утечке персональных данных, затрагивающей ваши данные.

        После окончания договора мы удаляем данные, как описано в разделе 10, если закон не обязывает нас их хранить. По запросу мы предоставляем вам информацию, необходимую, чтобы показать выполнение этих обязательств.
    end_title: 10. После окончания договора
    end_text: |-
        Мы удаляем ваш сайт, панель управления и весь их контент, включая данные ваших клиентов, через 30 дней после окончания договора. Если ваш сайт отключён из-за неоплаченной суммы, мы также удаляем его через 30 дней отключения, и договор на этом заканчивается.

        До этого вы можете попросить нас по email прислать копию ваших текстов, фото, запросов и отзывов. Счета и платёжные записи мы храним столько, сколько требует налоговое законодательство.
    changes_title: 11. Изменения этих условий
    changes_text: |-
        Мы можем изменять эти условия. Мы присылаем вам новые условия по email не менее чем за 30 дней до их вступления в силу. Если вы не согласны, вы можете отказаться от сервиса до этого момента; если вы продолжаете пользоваться сервисом, действуют новые условия.
    law_title: 12. Право и споры
    law_text: |-
        Эти условия регулируются законодательством Испании. Споры рассматриваются судами по месту жительства %name%, если закон не предусматривает иное. Вопросы или жалобы? Сначала напишите на %email%; мы постараемся решить всё вместе.

privacy:
    title: Политика конфиденциальности
    scope_title: 1. Что охватывает эта политика
    scope_text: |-
        Эта политика объясняет, как %name% («мы») обращается с персональными данными на платформе %brand%: в поиске специалистов, в форме регистрации и в аккаунтах специалистов, которые используют %brand% для своего сайта. Мы являемся контролёром этих данных. Вопросы о ваших данных: %email%.

        Она не охватывает сайты наших клиентов. Каждый специалист отвечает за данные на своём сайте (см. правовую информацию на этом сайте). Мы обрабатываем эти данные по их поручению, как описано в разделе 9 наших условий (%terms_url%).
    data_title: 2. Какие данные мы используем
    data_text: |-
        Если вы регистрируетесь как специалист: название бизнеса, ваше имя, адрес email, номер телефона и WhatsApp, адрес, налоговый номер, район работы, языки, доменное имя, ваше сообщение нам, пароль (хранится только в зашифрованном виде, как хеш) и дата принятия наших условий.

        Если вы клиент: ваш тариф, платежи и счета. Платежи проходят через Mollie: мы никогда не видим полные данные вашей карты или счёта, только краткое описание, например марку карты и последние цифры или часть IBAN.

        Если вы ищете специалиста: профессию и город, которые вы ищете. Ваш IP-адрес недолго используется для защиты наших форм и поиска от злоупотреблений.

        Если вы пишете нам: ваш адрес email и то, что вы пишете.
    purposes_title: 3. Зачем мы их используем и на каком правовом основании
    purposes_text: |-
        - Чтобы проверить вашу регистрацию, создать и поддерживать ваш сайт, управлять аккаунтом и отправлять вам письма о сервисе: для исполнения договора с вами (статья 6(1)(b) GDPR).
        - Чтобы выставлять счета и вести учёт: юридическая обязанность по налоговому и коммерческому праву Испании (статья 6(1)(c)).
        - Чтобы показывать ваш бизнес в поиске %brand%: часть сервиса, то есть наш договор (статья 6(1)(b)).
        - Чтобы защищать платформу и предотвращать спам и злоупотребления: наш законный интерес (статья 6(1)(f)).

        Мы не продаём ваши данные, не используем их для рекламы и не принимаем в отношении вас автоматизированных решений.
    recipients_title: 4. Кому мы передаём данные
    recipients_text: |-
        Мы передаём данные только компаниям, которые помогают нам обеспечивать работу сервиса (субобработчикам), и только то, что им нужно:
        - Hetzner Online GmbH, Германия: хостинг платформы и всех сайтов.
        - Mollie B.V., Нидерланды: платежи.
        - FacturaDirecta (Испания): счета.
        - Cloudflare, Inc., США: проверка на спам (Turnstile) в формах.
        - Google LLC, США: настройка Google Search Console для вашего сайта.
        - OpenStreetMap Foundation, Великобритания: преобразование адресов и городов в точки на карте (Nominatim).
        - Plausible Insights OÜ, Эстония: статистика посещений без cookie на сайтах клиентов, которые её используют.
        - Наш почтовый провайдер — для отправки писем с платформы и сайтов.

        Если вы подключаете ИИ-ассистента к своей панели управления с помощью собственного токена, данные, которые читает ассистент, передаются компании, стоящей за этим ассистентом. Это ваш выбор, и он регулируется вашим соглашением с ней.

        Мы также передаём данные, когда этого требует закон, например налоговой службе.
    transfers_title: 5. Данные за пределами ЕС
    transfers_text: |-
        Cloudflare и Google находятся в США. Они сертифицированы по программе EU-US Data Privacy Framework и также используют стандартные договорные положения Европейской комиссии. В отношении Великобритании действует решение Европейской комиссии о достаточном уровне защиты.
    retention_title: 6. Как долго мы храним данные
    retention_text: |-
        - Данные аккаунта и сайта: пока вы являетесь клиентом, плюс 30 дней (см. раздел 10 наших условий).
        - Неодобренные заявки на регистрацию: удаляются в течение 3 месяцев.
        - Счета и платёжные записи: 6 лет, как требует коммерческое право Испании.
        - IP-адреса для защиты от злоупотреблений: не более нескольких часов. Журналы сервера: не более 30 дней.
        - Письма: столько, сколько нужно, чтобы вам помочь, но не более 2 лет после последнего контакта.
    cookies_title: 7. Cookie
    cookies_text: |-
        Платформа использует только один cookie, необходимый, чтобы оставаться в системе в панели управления. Он удаляется, когда вы выходите из системы или закрываете браузер. Мы не используем отслеживающие или рекламные cookie, поэтому баннера о cookie нет. Проверка на спам от Cloudflare в наших формах считывает технические данные вашего браузера, но не отслеживает вас на других сайтах.
    rights_title: 8. Ваши права
    rights_text: |-
        Вы можете попросить нас показать, исправить или удалить ваши данные, ограничить их использование, получить их в распространённом формате или возразить против их использования. Большинство данных аккаунта вы можете изменить сами в панели управления. Пишите на %email%; мы отвечаем в течение месяца.

        Вы также можете подать жалобу в испанский орган по защите данных (Agencia Española de Protección de Datos, www.aepd.es).
