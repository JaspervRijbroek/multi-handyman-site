pros:
    title: '%brand% | Websites for trades in Spain that Google and AI assistants can find'
    description: Websites for handymen and builders in Spain. Found on Google Maps, Google Search and by AI assistants like ChatGPT, and listed in the %brand% search. Pay monthly, or yearly with two months free.
    og_title: '%brand%: get found on Google and by AI assistants'
    eyebrow: Websites for trades in Spain
    h1_start: 'More work from '
    h1_highlight: your own
    h1_end: ' town.'
    lead: Get a professional website, show up on Google Maps, Google Search and in AI assistants like ChatGPT, and let customers contact you directly. We handle the technical side so you can keep working.
    cta: Get started
    see_pricing: See pricing
    why_title: Why tradespeople choose %brand%
    reason1_title: No commission
    reason1_text: Customers call, WhatsApp or email you directly. Every euro of the job is yours.
    reason2_title: Your own website
    reason2_text: A real website on your own domain, with your services, your projects, your reviews and your work area, in %count% languages.
    reason3_title: Found by customers nearby
    reason3_text: Listed in the %brand% search, with structured data and one page per language, so Google, Google Maps and AI assistants know what you do and where.
    reason4_title: We do the technical work
    reason4_text: Hosting, HTTPS, backups, Google setup and updates are taken care of. You update your projects from your phone.
    testimonials_eyebrow: Testimonials
    testimonials_title: Tradespeople on %brand%, in their own words.
    how_eyebrow: How it works
    how_title: Live within a few days
    step1_title: Tell us about your business
    step1_text: 'Fill in the sign-up form: what you do, where you work and which languages you need.'
    step2_title: We build and connect everything
    step2_text: We check your details, set up your website and domain, and connect it to Google.
    step3_title: Customers find you
    step3_text: On Google, on Maps, in our search and through AI assistants. You get the calls; we keep it all running.
    price_title: One plan. Everything included.
    price_text: No commission on jobs. Pay monthly and cancel any month, or pay for the year and get two months free.
    plan_name: '%brand% complete'
    plan_name_yearly: '%brand% complete · Yearly'
    billing: Billing period
    monthly: Monthly
    yearly: Yearly
    free2: 2 months free
    per_month: / month
    per_year: / year
    month_note: Billed every month. No contract, cancel any month.
    year_note: That’s €%per_month% a month. You get 12 months for the price of 10, paid up front.
    plan_note: excl. VAT · no setup fee
    included: What’s included
    inc1_title: SEO optimisation
    inc1_text: Page titles, descriptions and texts set up so Google shows you for jobs in your towns, in every language.
    inc2_title: AI search optimisation
    inc2_text: Structured information so assistants like ChatGPT and Gemini can find and recommend you.
    inc3_title: Google Search Console
    inc3_text: Connected and verified with your sitemap, so every page and language gets indexed.
    inc4_title: Google Maps
    inc4_text: We set up your Google Business Profile so you appear on the map.
    inc5_title: Future updates
    inc5_text: Every new feature and improvement we build is added to your plan at no extra cost.
    more: And more
    more1: Listed in the %brand% search and map
    more2: Customer reviews you approve
    more3: Your own domain with HTTPS
    more4: '%count% languages'
    more5: Contact form straight to your inbox
    more6: WhatsApp & click-to-call
    more7: Project gallery you update yourself
    more8: Legal pages for Spain
    more9: No cookie banner needed
    more10: Hosting, backups & updates
    whatsapp: Ask a question on WhatsApp
    faq_eyebrow: FAQ
    faq_title: Questions we often get
    faq1_q: What does “findable by AI assistants” actually mean?
    faq1_a: 'More and more people ask ChatGPT, Gemini, Claude or Perplexity things like “find me an English-speaking plumber near Jávea”. Those assistants read websites to answer. Your site gives them clean, structured facts — what you do, where you work, how to reach you — so they can recommend you with confidence instead of guessing.'
    faq2_q: Is there a setup fee or a long contract?
    faq2_a: No setup fee and no contract. One price covers the website, hosting, the Google setup and ongoing SEO. Pay monthly and cancel any month, or pay a year up front and get two months free. We email you two weeks before every yearly payment.
    faq3_q: Do I need to know anything about websites?
    faq3_a: No. We build the site, connect your domain and set up Google for you. Afterwards you can update your services and add photos of recent work from a simple admin — or just send them to us.
    faq4_q: Can I use my own domain name?
    faq4_a: Yes. Bring the domain you already have or we help you register one. HTTPS is included and works from the first visit.
    faq5_q: Which languages are supported?
    faq5_a: English, Spanish, Dutch, German and French. Pick the languages your customers speak; each one gets its own pages so Google and AI assistants show the right version to the right person.
    faq6_q: Is it legal for a business in Spain?
    faq6_a: Every site comes with a legal notice and privacy page (LSSI and GDPR) generated from your business details, and no tracking cookie banner is needed. We still recommend having your gestor check the texts.
    final_title: Ready when you are.
    final_text: Sign-up takes about five minutes. We check your details and your website usually goes live within two working days. €%price% per month, or two months free with the yearly plan.

