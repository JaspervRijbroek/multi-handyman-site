terms:
    title: Allgemeine Geschäftsbedingungen
    scope_title: 1. Geltungsbereich
    scope_text: |-
        Diese Bedingungen gelten für den Website-Dienst %brand%, den %name% („wir“, „uns“) für Unternehmen und Selbstständige („Sie“) erbringt.

        %brand% ist nur für Gewerbetreibende. Mit der Anmeldung bestätigen Sie, dass Sie für Ihr Unternehmen oder Gewerbe handeln und nicht als Verbraucher. Verbraucherschutzregeln, wie das Widerrufsrecht, gelten daher nicht.
    service_title: 2. Der Dienst
    service_text: |-
        Wir erstellen und hosten eine Website für Ihren Betrieb, unter einer Subdomain von %brand% oder unter Ihrer eigenen Domain. Der Dienst umfasst Hosting, HTTPS, einen einfachen Verwaltungsbereich zum Bearbeiten Ihrer Website, ein Kontaktformular, Kundenbewertungen, ein Impressum und eine Datenschutzseite, die Einrichtung der Google Search Console und einen Eintrag in der Suche von %brand% für Handwerker.

        Wir können Funktionen mit der Zeit verbessern oder ändern. Eine Hauptfunktion entfernen wir nicht, ohne Sie vorher zu informieren.

        Wir können keine Platzierung bei Google oder anderen Suchmaschinen garantieren und auch keine bestimmte Zahl an Anfragen oder Aufträgen.
    account_title: 3. Anmeldung und Ihr Konto
    account_text: |-
        Nach Ihrer Anmeldung prüfen wir Ihre Angaben. Wir können eine Anmeldung ohne Angabe von Gründen ablehnen. Der Vertrag beginnt, wenn wir Ihre Anmeldung freigeben und Ihnen die Willkommens-E-Mail schicken.

        Sorgen Sie dafür, dass Ihre Angaben richtig und aktuell sind. Halten Sie Ihr Passwort und ein etwaiges Token für einen KI-Assistenten geheim: Sie sind für alles verantwortlich, was mit Ihrem Login oder Token geschieht.
    price_title: 4. Preis und Zahlung
    price_text: |-
        Es gilt der Preis, der bei Ihrer Anmeldung auf unserer Website angegeben war, sofern wir nichts anderes mit Ihnen vereinbart haben. Die Preise verstehen sich zuzüglich der gesetzlichen Mehrwertsteuer.

        Ihre Website ist bis zum 1. des Monats nach der Einrichtung gratis. Danach:
        - Monatstarif: im Voraus zahlbar am 1. jedes Monats.
        - Jahrestarif: 12 Monate zum Preis von 10, einmal jährlich im Voraus zahlbar. Wir schicken Ihnen zwei Wochen vor jeder Jahreszahlung eine E-Mail.

        Die Zahlungen werden automatisch von unserem Zahlungsdienstleister Mollie eingezogen (Karte oder SEPA-Lastschrift). Für jede Zahlung erhalten Sie eine Rechnung.

        Schlägt eine Zahlung fehl, schicken wir Erinnerungen mit einem Zahlungslink. Ist der Betrag eine Woche nach der letzten Erinnerung (etwa fünf Wochen nach dem Zahlungstermin) noch nicht bezahlt, nehmen wir Ihre Website offline, bis er bezahlt ist. Ihr Verwaltungsbereich bleibt verfügbar.

        Wir können den Preis ändern. Wir teilen Ihnen das mindestens 30 Tage vorher per E-Mail mit; der neue Preis gilt ab Ihrem nächsten Zahlungszeitraum. Sind Sie nicht einverstanden, können Sie vorher kündigen.
    cancel_title: 5. Laufzeit und Kündigung
    cancel_text: |-
        Es gibt keine Mindestlaufzeit. Sie können jederzeit per E-Mail an %email% kündigen.

        Monatstarif: Der Dienst endet am Ende des Monats, den Sie bereits bezahlt haben. Es wird nichts mehr abgebucht.

        Jahrestarif: Der Dienst endet am Ende des Jahres, das Sie bereits bezahlt haben. Jahreszahlungen werden bei einer Kündigung während des Jahres nicht erstattet, auch nicht anteilig. Um die nächste Jahreszahlung zu vermeiden, kündigen Sie vor deren Fälligkeit.

        Wir können den Vertrag mit einer Frist von 30 Tagen per E-Mail kündigen. In diesem Fall erstatten wir bezahlte, aber nicht genutzte Monate. Wir können sofort kündigen, wenn Sie schwer gegen diese Bedingungen verstoßen, zum Beispiel durch rechtswidrige Inhalte oder Nichtzahlung.
    content_title: 6. Ihre Inhalte
    content_text: |-
        Sie sind für alles auf Ihrer Website verantwortlich: Texte, Fotos, Preise, Kontakt- und Firmendaten sowie die Angaben in Ihrem Impressum (Name, Steuernummer, Adresse). Sie bestätigen, dass Sie die Texte und Fotos verwenden dürfen und dass Ihre Website und Ihr Betrieb den Gesetzen entsprechen.

        Das Impressum und die Datenschutzseite, die wir erstellen, sind Vorlagen. Lassen Sie sie von Ihrem Gestor oder Anwalt prüfen.

        Bewertungen müssen von echten Kunden stammen. Sie dürfen keine Bewertungen selbst schreiben, schreiben lassen oder für gute Bewertungen eine Gegenleistung anbieten.

        Sie bleiben Eigentümer Ihrer Inhalte. Sie erlauben uns, sie zu speichern, zu kopieren und anzuzeigen, um Ihre Website zu betreiben, und Ihren Firmennamen, Ort, Ihre Gewerke und Ihre Bewertung in der Suche von %brand% zu zeigen.

        Wir können Inhalte entfernen oder Ihre Website offline nehmen, wenn sie offensichtlich rechtswidrig sind oder anderen schaden, oder wenn eine Behörde es anordnet. Wenn möglich, kontaktieren wir Sie vorher.

        Wenn Sie Ihre eigene Domain verwenden, bleiben Sie deren Inhaber und sind für Registrierung und DNS verantwortlich. Die Subdomain von %brand% bleibt unsere.
    availability_title: 7. Verfügbarkeit
    availability_text: |-
        Wir tun unser Bestes, um Ihre Website online und sicher zu halten, und erstellen regelmäßig Backups. Wir können nicht versprechen, dass der Dienst immer verfügbar oder fehlerfrei ist. Wartungsarbeiten können kurze Unterbrechungen verursachen. Bewahren Sie eine eigene Kopie wichtiger Texte und Fotos auf.
    liability_title: 8. Haftung
    liability_text: |-
        Unsere Haftung ist insgesamt auf den Betrag begrenzt, den Sie uns in den 12 Monaten vor dem Schadensereignis bezahlt haben. Wir haften nicht für indirekte Schäden, wie entgangene Aufträge, entgangenen Gewinn oder Datenverlust, und nicht für die Dienste anderer Unternehmen wie Google, Mollie oder Ihres Domain-Registrars.

        Diese Beschränkungen gelten nicht für vorsätzlich oder grob fahrlässig verursachte Schäden.
    processing_title: 9. Verarbeitung personenbezogener Daten in Ihrem Auftrag (Art. 28 DSGVO)
    processing_text: |-
        Ihre Website erfasst personenbezogene Daten Ihrer Kunden und Besucher, zum Beispiel Nachrichten über das Kontaktformular, Bewertungen und Kontaktdaten, die Sie eingeben, um einen Bewertungslink zu senden. Für diese Daten sind Sie der Verantwortliche und wir Ihr Auftragsverarbeiter. Dieser Abschnitt ist der Auftragsverarbeitungsvertrag zwischen uns.

        Wir verarbeiten diese Daten nur, um Ihre Website und Ihren Verwaltungsbereich wie in diesen Bedingungen beschrieben zu betreiben, und nach Ihren dokumentierten Weisungen (Ihre Nutzung des Verwaltungsbereichs gilt als solche). Wir verwenden sie für nichts anderes und verkaufen sie nicht.

        Alle bei %brand%, die Zugriff auf die Daten haben, sind zur Vertraulichkeit verpflichtet.

        Wir treffen angemessene Sicherheitsmaßnahmen: HTTPS, Logins mit Passwort, Trennung der Daten jedes Kunden, regelmäßige Updates und Backups.

        Sie erteilen uns die allgemeine Genehmigung, die in unserer Datenschutzerklärung (%privacy_url%) genannten Unterauftragsverarbeiter einzusetzen. Bevor wir einen hinzufügen oder ersetzen, informieren wir Sie mindestens 30 Tage vorher per E-Mail; wenn Sie widersprechen, können Sie kündigen.

        Wir unterstützen Sie, soweit zumutbar, bei der Beantwortung von Anfragen von Personen, die ihre Rechte nach der DSGVO ausüben, und bei der Erfüllung Ihrer übrigen Pflichten nach der DSGVO. Die meisten Daten können Sie im Verwaltungsbereich selbst einsehen, ändern und löschen.

        Wir informieren Sie unverzüglich, nachdem uns eine Verletzung des Schutzes Ihrer personenbezogenen Daten bekannt geworden ist.

        Nach Vertragsende löschen wir die Daten wie in Abschnitt 10 beschrieben, sofern wir sie nicht gesetzlich aufbewahren müssen. Auf Anfrage geben wir Ihnen die Informationen, die Sie brauchen, um die Einhaltung dieser Pflichten nachzuweisen.
    end_title: 10. Nach Vertragsende
    end_text: |-
        Wir löschen Ihre Website, Ihren Verwaltungsbereich und alle Inhalte, einschließlich der Daten Ihrer Kunden, 30 Tage nach Vertragsende. Ist Ihre Website wegen eines offenen Betrags offline, löschen wir sie ebenfalls nach 30 Tagen offline, und der Vertrag endet dann.

        Vorher können Sie per E-Mail eine Kopie Ihrer Texte, Fotos, Anfragen und Bewertungen anfordern. Rechnungen und Zahlungsbelege bewahren wir so lange auf, wie es das Steuerrecht verlangt.
    changes_title: 11. Änderungen dieser Bedingungen
    changes_text: |-
        Wir können diese Bedingungen ändern. Wir schicken Ihnen die neuen Bedingungen mindestens 30 Tage, bevor sie gelten, per E-Mail. Sind Sie nicht einverstanden, können Sie vorher kündigen; nutzen Sie den Dienst weiter, gelten die neuen Bedingungen.
    law_title: 12. Recht und Streitigkeiten
    law_text: |-
        Für diese Bedingungen gilt spanisches Recht. Zuständig sind die Gerichte am Wohnort von %name%, sofern das Gesetz nichts anderes bestimmt. Fragen oder Beschwerden? Schreiben Sie zuerst an %email%; wir versuchen, gemeinsam eine Lösung zu finden.

privacy:
    title: Datenschutzerklärung
    scope_title: 1. Worum es in dieser Erklärung geht
    scope_text: |-
        Diese Erklärung beschreibt, wie %name% („wir“) mit personenbezogenen Daten auf der Plattform %brand% umgeht: der Suche nach Handwerkern, dem Anmeldeformular und den Konten der Handwerker, die %brand% für ihre Website nutzen. Für diese Daten sind wir der Verantwortliche. Fragen zu Ihren Daten: %email%.

        Sie gilt nicht für die Websites unserer Kunden. Jeder Handwerker ist für die Daten auf seiner eigenen Website verantwortlich (siehe das Impressum dieser Website). Wir verarbeiten diese Daten in seinem Auftrag, wie in Abschnitt 9 unserer AGB (%terms_url%) beschrieben.
    data_title: 2. Welche Daten wir verwenden
    data_text: |-
        Wenn Sie sich als Handwerker anmelden: Ihr Firmenname, Ihr Name, Ihre E-Mail-Adresse, Telefon- und WhatsApp-Nummer, Adresse, Steuernummer, Ihr Einsatzgebiet, Ihre Sprachen, Ihr Domainname, Ihre Nachricht an uns, Ihr Passwort (nur verschlüsselt als Hash gespeichert) und das Datum, an dem Sie unsere AGB akzeptiert haben.

        Wenn Sie Kunde sind: Ihr Tarif, Ihre Zahlungen und Rechnungen. Zahlungen laufen über Mollie: Wir sehen nie Ihre vollständigen Karten- oder Bankdaten, nur eine kurze Beschreibung wie die Kartenmarke und die letzten Ziffern oder einen Teil Ihrer IBAN.

        Wenn Sie einen Handwerker suchen: das Gewerk und den Ort, nach denen Sie suchen. Ihre IP-Adresse wird kurzzeitig verwendet, um unsere Formulare und die Suche vor Missbrauch zu schützen.

        Wenn Sie uns eine E-Mail schreiben: Ihre E-Mail-Adresse und was Sie schreiben.
    purposes_title: 3. Wozu wir sie verwenden und auf welcher Rechtsgrundlage
    purposes_text: |-
        - Um Ihre Anmeldung zu prüfen, Ihre Website zu erstellen und zu betreiben, Ihr Konto zu verwalten und Ihnen E-Mails zum Dienst zu schicken: zur Erfüllung unseres Vertrags mit Ihnen (Art. 6 Abs. 1 lit. b DSGVO).
        - Um Ihnen Rechnungen zu stellen und unsere Buchhaltung zu führen: eine rechtliche Pflicht nach spanischem Steuer- und Handelsrecht (Art. 6 Abs. 1 lit. c).
        - Um Ihren Betrieb in der Suche von %brand% zu zeigen: Teil des Dienstes, also unser Vertrag (Art. 6 Abs. 1 lit. b).
        - Um die Plattform sicher zu halten und Spam und Missbrauch zu verhindern: unser berechtigtes Interesse (Art. 6 Abs. 1 lit. f).

        Wir verkaufen Ihre Daten nicht, nutzen sie nicht für Werbung und treffen keine automatisierten Entscheidungen über Sie.
    recipients_title: 4. An wen wir Daten weitergeben
    recipients_text: |-
        Wir geben Daten nur an Unternehmen weiter, die uns beim Betrieb des Dienstes helfen (Unterauftragsverarbeiter), und nur, was sie brauchen:
        - Hetzner Online GmbH, Deutschland: Hosting der Plattform und aller Websites.
        - Mollie B.V., Niederlande: Zahlungen.
        - FacturaDirecta (Spanien): Rechnungen.
        - Cloudflare, Inc., USA: die Spamprüfung (Turnstile) in Formularen.
        - Google LLC, USA: Einrichtung der Google Search Console für Ihre Website.
        - OpenStreetMap Foundation, Vereinigtes Königreich: Umwandlung von Adressen und Orten in Kartenpositionen (Nominatim).
        - Plausible Insights OÜ, Estland: cookielose Besucherstatistiken auf Kunden-Websites, die sie nutzen.
        - Unser E-Mail-Anbieter, für den Versand von E-Mails der Plattform und der Websites.

        Wenn Sie mit Ihrem eigenen Token einen KI-Assistenten mit Ihrem Verwaltungsbereich verbinden, gehen die Daten, die der Assistent liest, an das Unternehmen hinter diesem Assistenten. Das ist Ihre Entscheidung und fällt unter Ihre Vereinbarung mit diesem Unternehmen.

        Wir geben Daten auch weiter, wenn das Gesetz es verlangt, zum Beispiel an die Steuerbehörde.
    transfers_title: 5. Daten außerhalb der EU
    transfers_text: |-
        Cloudflare und Google haben ihren Sitz in den USA. Sie sind nach dem EU-US Data Privacy Framework zertifiziert und verwenden zusätzlich die Standardvertragsklauseln der Europäischen Kommission. Für das Vereinigte Königreich gibt es einen Angemessenheitsbeschluss der Europäischen Kommission.
    retention_title: 6. Wie lange wir Daten aufbewahren
    retention_text: |-
        - Konto- und Website-Daten: solange Sie Kunde sind, plus 30 Tage (siehe Abschnitt 10 unserer AGB).
        - Anmeldungen, die wir nicht freigeben: gelöscht innerhalb von 3 Monaten.
        - Rechnungen und Zahlungsbelege: 6 Jahre, wie es das spanische Handelsrecht verlangt.
        - IP-Adressen zum Schutz vor Missbrauch: höchstens einige Stunden. Server-Logs: höchstens 30 Tage.
        - E-Mails: solange nötig, um Ihnen zu helfen, höchstens 2 Jahre nach unserem letzten Kontakt.
    cookies_title: 7. Cookies
    cookies_text: |-
        Die Plattform verwendet nur ein Cookie, das nötig ist, um im Verwaltungsbereich angemeldet zu bleiben. Es wird gelöscht, wenn Sie sich abmelden oder Ihren Browser schließen. Wir verwenden keine Tracking- oder Werbe-Cookies, daher gibt es kein Cookie-Banner. Die Spamprüfung von Cloudflare in unseren Formularen liest technische Daten Ihres Browsers, verfolgt Sie aber nicht über Websites hinweg.
    rights_title: 8. Ihre Rechte
    rights_text: |-
        Sie können verlangen, Ihre Daten einzusehen, zu berichtigen oder zu löschen, ihre Verarbeitung einzuschränken oder sie in einem gängigen Format zu erhalten, und Sie können ihrer Verarbeitung widersprechen. Die meisten Kontodaten können Sie im Verwaltungsbereich selbst ändern. Schreiben Sie an %email%; wir antworten innerhalb eines Monats.

        Sie können sich auch bei der spanischen Datenschutzbehörde beschweren (Agencia Española de Protección de Datos, www.aepd.es).
