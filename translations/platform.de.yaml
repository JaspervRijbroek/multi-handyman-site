    faq_eyebrow: FAQ
    faq_title: Häufige Fragen
    faq1_q: Was bedeutet „von KI-Assistenten auffindbar“ eigentlich?
    faq1_a: 'Immer mehr Menschen fragen ChatGPT, Gemini, Claude oder Perplexity etwa „Finde mir einen deutschsprachigen Klempner bei Jávea“. Diese Assistenten lesen Websites, um zu antworten. Ihre Website liefert ihnen klare, strukturierte Fakten — was Sie tun, wo Sie arbeiten, wie man Sie erreicht —, damit sie Sie mit Überzeugung empfehlen, statt zu raten.'
    faq2_q: Gibt es eine Einrichtungsgebühr oder einen langen Vertrag?
    faq2_a: Keine Einrichtungsgebühr und kein Vertrag. Ein Preis deckt die Website, das Hosting, die Einrichtung bei Google und laufende SEO ab. Monatlich zahlen und jeden Monat kündigen, oder ein Jahr im Voraus zahlen und zwei Monate gratis bekommen. Wir schicken Ihnen zwei Wochen vor jeder Jahreszahlung eine E-Mail.
    faq3_q: Muss ich mich mit Websites auskennen?
    faq3_a: Nein. Wir bauen die Website, verbinden Ihre Domain und richten Google für Sie ein. Danach können Sie Ihre Leistungen aktualisieren und Fotos aktueller Arbeiten in einem einfachen Verwaltungsbereich hinzufügen — oder Sie schicken sie uns einfach.
    faq4_q: Kann ich meine eigene Domain verwenden?
    faq4_a: Ja. Bringen Sie Ihre bestehende Domain mit, oder wir helfen Ihnen, eine zu registrieren. HTTPS ist inklusive und funktioniert ab dem ersten Besuch.
    faq5_q: Welche Sprachen werden unterstützt?
    faq5_a: Englisch, Spanisch, Niederländisch, Deutsch und Französisch. Wählen Sie die Sprachen Ihrer Kunden; jede bekommt eigene Seiten, damit Google und KI-Assistenten der richtigen Person die richtige Version zeigen.
    faq6_q: Ist das für einen Betrieb in Spanien rechtlich in Ordnung?
    faq6_a: Jede Website hat ein Impressum und eine Datenschutzseite (LSSI und DSGVO), erstellt aus Ihren Firmendaten, und es ist kein Cookie-Banner nötig. Wir empfehlen trotzdem, die Texte von Ihrem Gestor prüfen zu lassen.
    final_title: Bereit, wenn Sie es sind.
    final_text: Die Anmeldung dauert etwa fünf Minuten. Wir prüfen Ihre Angaben, und Ihre Website ist meist innerhalb von zwei Werktagen online. %price% € pro Monat, oder zwei Monate gratis mit dem Jahrestarif.

