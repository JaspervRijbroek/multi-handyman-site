legal:
    title: Legal notice & privacy
    owner:
        title: Who runs this website
        text: 'In accordance with Spanish law (Ley 34/2002, LSSI), the owner of %site% is:'
        name: Owner
        tax_id: Tax ID (NIF/NIE/CIF)
        address: Address
        phone: Phone
    privacy:
        title: Privacy policy
        controller: '%owner% is responsible for the personal data you send through this website.'
        purpose: We use the data from the contact form only to answer your enquiry and, if you wish, to prepare a quote. The legal basis is your consent and taking steps at your request before entering into a contract. We do not sell or share your data, except with providers that host this website and its email on our behalf. To block spam, the contact form is protected by Cloudflare Turnstile, which checks your browser without tracking cookies.
        retention: We keep your enquiry as long as needed to handle it and to meet legal obligations.
        reviews: If you write a review, we publish your first name, town (if given), rating and review on this website once checked. You can ask us to remove it at any time.
        rights: 'You can request access, correction or deletion of your data, or object to its use, by emailing %email%. You may also file a complaint with the Spanish Data Protection Agency (www.aepd.es).'
    cookies:
        title: Cookies
        text: This website uses no tracking or advertising cookies. A technical session cookie is only set when you use the contact form, to protect it against abuse. Visitor statistics, if enabled, are collected anonymously without cookies.
        map: The map in the contact section is only loaded from OpenStreetMap (OpenStreetMap Foundation, United Kingdom) when you click “Show map”; your IP address is then sent to their servers to load the map. OpenStreetMap sets no advertising or tracking cookies.

