    lead: Consigue una web profesional, aparece en Google Maps, en Google y en asistentes de IA como ChatGPT, y deja que los clientes te contacten directamente. Nosotros nos encargamos de la parte técnica para que tú sigas trabajando.
    cta: Empieza ahora
    see_pricing: Ver precios
    why_title: Por qué los profesionales eligen %brand%
    reason1_title: Sin comisiones
    reason1_text: Los clientes te llaman, te escriben por WhatsApp o te envían un email directamente. Cada euro del trabajo es tuyo.
    reason2_title: Tu propia web
    reason2_text: Una web de verdad con tu propio dominio, tus servicios, tus proyectos, tus opiniones y tu zona de trabajo, en %count% idiomas.
    reason3_title: Te encuentran los clientes de tu zona
    reason3_text: Apareces en el buscador de %brand%, con datos estructurados y una página por idioma, para que Google, Google Maps y los asistentes de IA sepan qué haces y dónde.
    reason4_title: Nosotros hacemos lo técnico
    reason4_text: Alojamiento, HTTPS, copias de seguridad, configuración de Google y actualizaciones incluidos. Tú actualizas tus proyectos desde el móvil.
    testimonials_eyebrow: Testimonios
    testimonials_title: Los profesionales de %brand%, en sus propias palabras.
    how_eyebrow: Cómo funciona
    how_title: En marcha en pocos días
    step1_title: Cuéntanos sobre tu negocio
    step1_text: 'Rellena el formulario de registro: qué haces, dónde trabajas y qué idiomas necesitas.'
    step2_title: Lo creamos y conectamos todo
    step2_text: Revisamos tus datos, preparamos tu web y tu dominio, y la conectamos con Google.
    step3_title: Los clientes te encuentran
    step3_text: En Google, en Maps, en nuestro buscador y a través de los asistentes de IA. Tú recibes las llamadas; nosotros lo mantenemos todo en marcha.
    price_title: Un plan. Todo incluido.
    price_text: Sin comisiones por trabajo. Paga cada mes y cancela cuando quieras, o paga el año y llévate dos meses gratis.
