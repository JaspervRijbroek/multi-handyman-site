    inc1_text: Títulos, descripciones y textos preparados para que Google te muestre en los trabajos de tus localidades, en todos los idiomas.
    inc2_title: Optimización para búsqueda con IA
    inc2_text: Información estructurada para que asistentes como ChatGPT y Gemini te encuentren y te recomienden.
