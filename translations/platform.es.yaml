    more1: Presencia en el buscador y el mapa de %brand%
    more2: Opiniones de clientes que tú apruebas
    more3: Tu propio dominio con HTTPS
    more4: '%count% idiomas'
    more5: Formulario de contacto directo a tu correo
    more6: WhatsApp y llamada con un clic
    more7: Galería de proyectos que actualizas tú
    more8: Páginas legales para España
    more9: Sin banner de cookies
    more10: Alojamiento, copias de seguridad y actualizaciones
    whatsapp: Pregúntanos por WhatsApp
    faq_eyebrow: Preguntas frecuentes
    faq_title: Lo que nos suelen preguntar
    faq1_q: ¿Qué significa que te encuentren los asistentes de IA?
    faq1_a: 'Cada vez más gente pregunta a ChatGPT, Gemini, Claude o Perplexity cosas como «busca un fontanero cerca de Jávea». Esos asistentes leen webs para responder. Tu web les da datos claros y estructurados —qué haces, dónde trabajas, cómo contactarte— para que te recomienden con confianza en lugar de adivinar.'
    faq2_q: ¿Hay cuota de alta o permanencia?
    faq2_a: No hay cuota de alta ni permanencia. Un solo precio incluye la web, el alojamiento, la configuración de Google y el SEO continuo. Paga cada mes y cancela cuando quieras, o paga el año por adelantado y llévate dos meses gratis. Te avisamos por email dos semanas antes de cada pago anual.
    faq3_q: ¿Tengo que saber algo de webs?
    faq3_a: No. Creamos la web, conectamos tu dominio y configuramos Google por ti. Después puedes actualizar tus servicios y añadir fotos de trabajos recientes desde un panel sencillo, o simplemente enviárnoslas.
    faq4_q: ¿Puedo usar mi propio dominio?
    faq4_a: Sí. Usa el dominio que ya tienes o te ayudamos a registrar uno. HTTPS incluido y funcionando desde la primera visita.
    faq5_q: ¿Qué idiomas hay?
    faq5_a: Inglés, español, neerlandés, alemán y francés. Elige los idiomas de tus clientes; cada uno tiene sus propias páginas para que Google y los asistentes de IA muestren la versión correcta a cada persona.
    faq6_q: ¿Es legal para un negocio en España?
    faq6_a: Cada web incluye un aviso legal y una política de privacidad (LSSI y RGPD) generados con los datos de tu negocio, y no necesita banner de cookies. Aun así, te recomendamos que tu gestor revise los textos.
    final_title: Cuando tú quieras.
    final_text: El registro lleva unos cinco minutos. Revisamos tus datos y tu web suele estar publicada en dos días laborables. %price% € al mes, o dos meses gratis con el plan anual.

