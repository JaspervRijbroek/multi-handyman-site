legal:
    title: Aviso legal y privacidad
    owner:
        title: Titular del sitio web
        text: 'En cumplimiento de la Ley 34/2002 (LSSI), el titular de %site% es:'
        name: Titular
        tax_id: NIF/NIE/CIF
        address: Domicilio
        phone: Teléfono
    privacy:
        title: Política de privacidad
        controller: '%owner% es responsable de los datos personales que envíe a través de este sitio web.'
        purpose: Utilizamos los datos del formulario de contacto únicamente para responder a su consulta y, si lo desea, preparar un presupuesto. La base legal es su consentimiento y la aplicación de medidas precontractuales a petición suya. No vendemos ni cedemos sus datos, salvo a los proveedores que alojan este sitio web y su correo en nuestro nombre. Para evitar el spam, el formulario de contacto está protegido por Cloudflare Turnstile, que comprueba su navegador sin cookies de seguimiento.
        retention: Conservamos su consulta el tiempo necesario para atenderla y cumplir con las obligaciones legales.
        reviews: Si escribe una opinión, publicamos su nombre, localidad (si la indica), valoración y opinión en esta web una vez revisada. Puede pedirnos que la retiremos en cualquier momento.
        rights: 'Puede solicitar el acceso, la rectificación o la supresión de sus datos, u oponerse a su tratamiento, escribiendo a %email%. También puede presentar una reclamación ante la Agencia Española de Protección de Datos (www.aepd.es).'
    cookies:
        title: Cookies
        text: Este sitio web no utiliza cookies de seguimiento ni de publicidad. Solo se establece una cookie técnica de sesión al usar el formulario de contacto, para protegerlo contra abusos. Las estadísticas de visitas, si están activadas, se recogen de forma anónima y sin cookies.
        map: El mapa de la sección de contacto solo se carga desde OpenStreetMap (OpenStreetMap Foundation, Reino Unido) cuando hace clic en «Mostrar mapa»; entonces su dirección IP se envía a sus servidores para cargar el mapa. OpenStreetMap no utiliza cookies de publicidad ni de seguimiento.

