legal:
    title: Mentions légales & confidentialité
    owner:
        title: Qui gère ce site
        text: 'Conformément à la loi espagnole (Ley 34/2002, LSSI), le propriétaire de %site% est :'
        name: Propriétaire
        tax_id: Numéro fiscal (NIF/NIE/CIF)
        address: Adresse
        phone: Téléphone
        email: E-mail
    privacy:
        title: Politique de confidentialité
        controller: '%owner% est responsable des données personnelles que vous envoyez via ce site.'
        purpose: Nous utilisons les données du formulaire de contact uniquement pour répondre à votre demande et, si vous le souhaitez, préparer un devis. La base légale est votre consentement et les mesures précontractuelles prises à votre demande. Nous ne vendons ni ne partageons vos données, sauf avec les prestataires qui hébergent ce site et ses e-mails pour notre compte. Contre le spam, le formulaire est protégé par Cloudflare Turnstile, qui vérifie votre navigateur sans cookies de suivi.
        retention: Nous conservons votre demande le temps nécessaire à son traitement et au respect de nos obligations légales.
        reviews: Si vous écrivez un avis, nous publions après vérification votre prénom, votre ville (si indiquée), votre note et votre avis sur ce site. Vous pouvez nous demander de le retirer à tout moment.
        rights: 'Vous pouvez demander l’accès, la rectification ou la suppression de vos données, ou vous opposer à leur utilisation, en écrivant à %email%. Vous pouvez aussi déposer une réclamation auprès de l’autorité espagnole de protection des données (www.aepd.es).'
    cookies:
        title: Cookies
        text: Ce site n’utilise aucun cookie de suivi ou publicitaire. Un cookie de session technique n’est déposé que lorsque vous utilisez le formulaire de contact, pour le protéger contre les abus. Les statistiques de visite, si elles sont activées, sont collectées de façon anonyme et sans cookies.
        map: La carte de la section contact n’est chargée depuis OpenStreetMap (OpenStreetMap Foundation, Royaume-Uni) que lorsque vous cliquez sur « Afficher la carte » ; votre adresse IP est alors envoyée à leurs serveurs. OpenStreetMap ne dépose aucun cookie publicitaire ni de suivi.

