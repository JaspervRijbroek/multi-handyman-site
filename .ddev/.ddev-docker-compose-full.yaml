name: ddev-multi-handyman-site
services:
  db:
    build:
      context: /Users/jaspervanrijbroek/Personal/multi-handyman-site/.ddev/.dbimageBuild
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ddev/ddev-dbserver-mariadb-11.4:v1.25.0
        gid: "20"
        uid: "501"
        username: jaspervanrijbroek
    cap_add:
      - SYS_NICE
    command: []
    container_name: ddev-multi-handyman-site-db
    environment:
      BITNAMI_VOLUME_DIR: ""
      COLUMNS: "80"
      DDEV_DATABASE: mariadb:11.4
      DDEV_DATABASE_FAMILY: mysql
      DDEV_GID: "20"
      DDEV_GOARCH: arm64
      DDEV_GOOS: darwin
      DDEV_HOSTNAME: multi-handyman-site.ddev.site,handyman-javea.ddev.site,jans-klusbedrijf.ddev.site
      DDEV_PHP_VERSION: "8.4"
      DDEV_PRIMARY_URL: https://multi-handyman-site.ddev.site
      DDEV_PRIMARY_URL_PORT: "443"
      DDEV_PRIMARY_URL_WITHOUT_PORT: https://multi-handyman-site.ddev.site
      DDEV_PROJECT: multi-handyman-site
      DDEV_PROJECT_TYPE: symfony
      DDEV_ROUTER_HTTP_PORT: "80"
      DDEV_ROUTER_HTTPS_PORT: "443"
      DDEV_SCHEME: https
      DDEV_SITENAME: multi-handyman-site
      DDEV_TLD: ddev.site
      DDEV_UID: "501"
      DDEV_USER: jaspervanrijbroek
      DDEV_VERSION: v1.25.0
      DOCKER_IP: 127.0.0.1
      HOST_DOCKER_INTERNAL_IP: ""
      IS_DDEV_PROJECT: "true"
      LINES: "24"
      MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/multi-handyman-site-db/mysql_history
      PGDATABASE: db
      PGHOST: 127.0.0.1
      PGPASSWORD: db
      PGUSER: db
      POSTGRES_DB: db
      POSTGRES_PASSWORD: db
      POSTGRES_USER: db
      TZ: Europe/Madrid
      USER: jaspervanrijbroek
    hostname: multi-handyman-site-db
    healthcheck:
      test:
        - CMD-SHELL
        - /healthcheck.sh
      timeout: 1m10s
      interval: 1s
      retries: 70
      start_period: 2m0s
      start_interval: 1s
    image: ddev/ddev-dbserver-mariadb-11.4:v1.25.0-multi-handyman-site-built
    labels:
      com.ddev.app-type: symfony
      com.ddev.approot: /Users/jaspervanrijbroek/Personal/multi-handyman-site
      com.ddev.platform: ddev
      com.ddev.site-name: multi-handyman-site
    networks:
      ddev_default: null
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3306
        protocol: tcp
    restart: "no"
    stop_grace_period: 1m0s
    user: "501:20"
    volumes:
      - type: volume
        source: database
        target: /var/lib/mysql
        volume:
          nocopy: true
      - type: bind
        source: /Users/jaspervanrijbroek/Personal/multi-handyman-site/.ddev
        target: /mnt/ddev_config
        bind: {}
      - type: bind
        source: /Users/jaspervanrijbroek/Personal/multi-handyman-site/.ddev/db_snapshots
        target: /mnt/snapshots
        bind: {}
      - type: volume
        source: ddev-global-cache
        target: /mnt/ddev-global-cache
        volume: {}
    working_dir: /home/jaspervanrijbroek
  web:
    build:
      context: /Users/jaspervanrijbroek/Personal/multi-handyman-site/.ddev/.webimageBuild
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ddev/ddev-webserver:v1.25.0
        DDEV_DATABASE: mariadb:11.4
        DDEV_PHP_VERSION: "8.4"
        gid: "20"
        uid: "501"
        username: jaspervanrijbroek
    cap_add:
      - SYS_PTRACE
    command:
      - /pre-start.sh
    container_name: ddev-multi-handyman-site-web
    environment:
      COLUMNS: "80"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /mnt/ddev-global-cache/corepack
      DDEV_APPROOT: /var/www/html
      DDEV_COMPOSER_ROOT: /var/www/html
      DDEV_DATABASE: mariadb:11.4
      DDEV_DATABASE_FAMILY: mysql
      DDEV_DOCROOT: public
      DDEV_FILES_DIR: ""
      DDEV_FILES_DIRS: ""
      DDEV_GID: "20"
      DDEV_GOARCH: arm64
      DDEV_GOOS: darwin
      DDEV_HOSTNAME: multi-handyman-site.ddev.site,handyman-javea.ddev.site,jans-klusbedrijf.ddev.site
      DDEV_MUTAGEN_ENABLED: "true"
      DDEV_PHP_VERSION: "8.4"
      DDEV_PRIMARY_URL: https://multi-handyman-site.ddev.site
      DDEV_PRIMARY_URL_PORT: "443"
      DDEV_PRIMARY_URL_WITHOUT_PORT: https://multi-handyman-site.ddev.site
      DDEV_PROJECT: multi-handyman-site
      DDEV_PROJECT_TYPE: symfony
      DDEV_ROUTER_HTTP_PORT: "80"
      DDEV_ROUTER_HTTPS_PORT: "443"
      DDEV_SCHEME: https
      DDEV_SITENAME: multi-handyman-site
      DDEV_TLD: ddev.site
      DDEV_UID: "501"
      DDEV_USER: jaspervanrijbroek
      DDEV_VERSION: v1.25.0
      DDEV_WEB_ENTRYPOINT: /mnt/ddev_config/web-entrypoint.d
      DDEV_WEBSERVER_TYPE: nginx-fpm
      DDEV_XDEBUG_ENABLED: "false"
      DDEV_XHPROF_MODE: xhgui
      DEPLOY_NAME: local
      DOCKER_IP: 127.0.0.1
      DOCROOT: public
      DRUSH_OPTIONS_URI: https://multi-handyman-site.ddev.site
      HOST_DOCKER_INTERNAL_IP: ""
      HTTP_EXPOSE: 80:80,8025:8025
      HTTPS_EXPOSE: 443:80,8026:8025
      IS_DDEV_PROJECT: "true"
      LINES: "24"
      MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/multi-handyman-site-web/mysql_history
      NODE_EXTRA_CA_CERTS: /mnt/ddev-global-cache/mkcert/rootCA.pem
      PGDATABASE: db
      PGHOST: db
      PGPASSWORD: db
      PGUSER: db
      PHP_IDE_CONFIG: serverName=multi-handyman-site.ddev.site
      SSH_AUTH_SOCK: /home/.ssh-agent/socket
      START_SCRIPT_TIMEOUT: "115"
      TZ: Europe/Madrid
      USER: jaspervanrijbroek
      VIRTUAL_HOST: multi-handyman-site.ddev.site,handyman-javea.ddev.site,jans-klusbedrijf.ddev.site
      npm_config_cache: /mnt/ddev-global-cache/npm
    hostname: multi-handyman-site-web
    healthcheck:
      test:
        - CMD-SHELL
        - /healthcheck.sh
      timeout: 1m10s
      interval: 1s
      retries: 70
      start_period: 2m0s
      start_interval: 1s
    image: ddev/ddev-webserver:v1.25.0-multi-handyman-site-built
    labels:
      com.ddev.app-type: symfony
      com.ddev.approot: /Users/jaspervanrijbroek/Personal/multi-handyman-site
      com.ddev.platform: ddev
      com.ddev.site-name: multi-handyman-site
    networks:
      ddev_default: null
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 80
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 443
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8025
        protocol: tcp
    restart: "no"
    user: "501:20"
    volumes:
      - type: volume
        source: project_mutagen
        target: /var/www
        volume:
          nocopy: true
      - type: volume
        source: project_mutagen
        target: /tmp/project_mutagen
        volume:
          nocopy: true
      - type: bind
        source: /Users/jaspervanrijbroek/Personal/multi-handyman-site/.ddev
        target: /mnt/ddev_config
        read_only: true
        bind: {}
      - type: bind
        source: /Users/jaspervanrijbroek/Personal/multi-handyman-site/.git
        target: /var/www/html/.git
        bind: {}
      - type: volume
        source: ddev-global-cache
        target: /mnt/ddev-global-cache
        volume: {}
      - type: volume
        source: ddev-ssh-agent_socket_dir
        target: /home/.ssh-agent
        volume: {}
    working_dir: /var/www/html/
  xhgui:
    profiles:
      - xhgui
    container_name: ddev-multi-handyman-site-xhgui
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      DDEV_DATABASE_FAMILY: mysql
      HOST_DOCKER_INTERNAL_IP: ""
      HTTP_EXPOSE: 8143:80
      HTTPS_EXPOSE: 8142:80
      TZ: Europe/Madrid
      VIRTUAL_HOST: multi-handyman-site.ddev.site,handyman-javea.ddev.site,jans-klusbedrijf.ddev.site
      XHGUI_PDO_PASS: db
      XHGUI_PDO_USER: db
      XHGUI_SAVE_HANDLER: pdo
    healthcheck:
      test:
        - CMD-SHELL
        - /healthcheck.sh
      timeout: 1m10s
      interval: 1s
      retries: 70
      start_period: 2m0s
      start_interval: 1s
    image: ddev/ddev-xhgui:v1.25.0
    labels:
      com.ddev.approot: /Users/jaspervanrijbroek/Personal/multi-handyman-site
      com.ddev.site-name: multi-handyman-site
    networks:
      ddev_default: null
      default: null
    restart: "no"
    x-ddev:
      describe-url-port: 'Launch: ddev xhgui'
networks:
  ddev_default:
    name: ddev_default
    external: true
  default:
    name: ddev-multi-handyman-site_default
    labels:
      com.ddev.platform: ddev
volumes:
  database:
    name: multi-handyman-site-mariadb
    external: true
  ddev-global-cache:
    name: ddev-global-cache
    external: true
  ddev-ssh-agent_socket_dir:
    name: ddev-ssh-agent_socket_dir
    external: true
  project_mutagen:
    name: multi-handyman-site_project_mutagen
    external: true
